# PostgreSQL's host-based authentication with BACKUP_PITR=on (compose.pitr.yaml
# mounts it and points hba_file here). It is the file the postgres image
# ends up with (initdb's trusted local and loopback lines, then the image's
# password line for every other host), plus one line: the backup service's
# base backups (pg_basebackup) connect with the replication protocol, which
# "all" does not cover. Check against the running server's before the first
# use: docker compose exec postgres sh -c 'cat "$PGDATA/pg_hba.conf"'
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     all             all                     scram-sha-256
host    all             all             all                     scram-sha-256
