# Optional monitoring for the production stack: Prometheus (scrapes every api
# and worker replica, evaluates monitoring/prometheus/alerts.yml), Alertmanager
# (mail, a webhook or Slack; the Watchdog to a dead man's switch), exporters
# for PostgreSQL, Redis and the host (node-exporter), an HTTPS and certificate probe through Caddy, and
# the backup service's state as metrics. Nothing
# in the default stack needs it. Add it to COMPOSE_FILE in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.monitoring.yaml
#   docker compose up -d
#
# METRICS_TOKEN must be set (the app's /metrics answers 404 without it). The
# UIs listen on the host's loopback only (127.0.0.1:9090 and :9093): reach
# them through an SSH tunnel (ssh -L 9090:127.0.0.1:9090 -L 9093:127.0.0.1:9093
# <host>). docs/deployment.md, "Alerting".
#
# Log shipping (Loki, Alloy, Grafana) is a second, separate opt-in inside this
# file: its services have Compose profiles, so they stay off until
# COMPOSE_PROFILES=logs (or logs,grafana) is set. docs/deployment.md, "Logs".
#
# Every service is hardened like compose.prod.yaml's: read_only, cap_drop: [ALL]
# (a capability added back, or the one service that isn't read_only, says why
# where it is), no-new-privileges, a /tmp tmpfs. docs/deployment.md,
# "Container hardening"; CI fails on a service without them.

# Bounded logs, as in compose.yaml (an anchor can't cross files).
x-logging: &logging
  driver: ${DOCKER_LOG_DRIVER:-local}
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: '${DOCKER_LOG_MAX_FILE:-5}'
    compress: 'true'

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Links in alerts point at the SSH tunnel's end.
      - --web.external-url=http://localhost:${PROMETHEUS_PORT:-9090}
    environment:
      # External labels on every alert (prometheus.yml).
      APP_ENV: ${APP_ENV:-production}
      SERVICE_NAME: ${SERVICE_NAME:-${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}}
    secrets:
      # The bearer token for the app's /metrics, as a file (credentials_file).
      - metrics_token
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      # The time series; retention (30 days, at most 4 GB) is in prometheus.yml.
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    # Hardened (docs/deployment.md, "Container hardening") except for
    # read_only: Compose refuses to create a secret that comes from a
    # variable (metrics_token, from METRICS_TOKEN) in a read-only service
    # ("`file` is the sole supported option"), so the root filesystem stays
    # writable. The image runs as `nobody` and writes /prometheus (the volume)
    # only; no capability, no way to gain one. The exception is explicit in
    # CI's "Every service is hardened" step.
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${PROMETHEUS_CPUS:-0.5}'
          memory: ${PROMETHEUS_MEMORY:-1G}
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    # Writes the configuration from the variables below, then starts Alertmanager.
    entrypoint: ['sh', '/etc/alertmanager/scripts/render-config.sh']
    command:
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:${ALERTMANAGER_PORT:-9093}
      # A single instance: no cluster gossip.
      - --cluster.listen-address=
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_URL: ${ALERT_SMTP_URL:-}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-true}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      # The dead man's switch's URL as a variable, used when the secret
      # below is empty (the secret wins).
      ALERT_WATCHDOG_URL: ${ALERT_WATCHDOG_URL:-}
      # The app's mail settings: the defaults of ALERT_SMTP_URL and ALERT_EMAIL_FROM.
      SMTP_URL: ${SMTP_URL:-}
      # Or the app's SMTP_URL from its file (compose.prod.yaml's smtp_url secret).
      SMTP_URL_FILE: ${SMTP_URL_FILE:+/run/secrets/smtp_url}
      MAIL_FROM: ${MAIL_FROM:-}
    secrets:
      # The Watchdog's ping URL (healthchecks.io), read by Alertmanager itself
      # (url_file). By default an empty file: no dead man's switch.
      - alert_watchdog_url
      - smtp_url
    # Hardened (docs/deployment.md, "Container hardening"): the image runs as
    # `nobody` and writes /alertmanager (the volume) and /tmp. The rendered
    # configuration (it holds the SMTP password) stays in memory.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager/scripts:ro
      # Silences and notification state survive a restart.
      - alertmanager_data:/alertmanager
    ports:
      - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9093/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${ALERTMANAGER_CPUS:-0.25}'
          memory: ${ALERTMANAGER_MEMORY:-128M}
    logging: *logging

  # The monitoring role (docs/deployment.md, "Database roles"): `migrate`
  # creates POSTGRES_MONITOR_USER (default app_monitor) with
  # POSTGRES_MONITOR_PASSWORD, a member of pg_monitor and nothing else, so the
  # exporter reads statistics and never a row. This extends compose.prod.yaml's
  # migrate service (Compose merges the maps, appends the secrets); the owner
  # keeps the exporter out of its credentials.
  migrate:
    environment:
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER:-app_monitor}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-}
      POSTGRES_MONITOR_PASSWORD_FILE: ${POSTGRES_MONITOR_PASSWORD_FILE:+/run/secrets/postgres_monitor_password}
    secrets:
      - postgres_monitor_password

  # pg_up, connections against max_connections, as the monitoring role.
  # Managed PostgreSQL: DATABASE_MONITOR_URL, the role `migrate` made there
  # (postgresql://app_monitor:<POSTGRES_MONITOR_PASSWORD>@<host>/<db>).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      # Built from POSTGRES_MONITOR_PASSWORD; with the password in
      # POSTGRES_MONITOR_PASSWORD_FILE (DATA_SOURCE_NAME empty), the stack's
      # database, the password from the same secret `migrate` set it from.
      DATA_SOURCE_NAME: ${DATABASE_MONITOR_URL:-${POSTGRES_MONITOR_PASSWORD:+postgresql://${POSTGRES_MONITOR_USER:-app_monitor}:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable}}
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_MONITOR_USER:-app_monitor}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_monitor_password
    secrets:
      - postgres_monitor_password
    # Hardened (docs/deployment.md, "Container hardening"): the image runs as
    # `nobody` and writes nothing; /tmp is there for the rule that every
    # service has one.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging: *logging

  # redis_up, memory against maxmemory (noeviction), persistence. Managed
  # Redis: it follows REDIS_URL (Sentinel isn't supported: drop it then).
  redis-exporter:
    # The Alpine build: redis/redis.sh reads REDIS_PASSWORD_FILE (the scratch
    # one has no shell, and its --redis.password-file wants a JSON map).
    image: oliver006/redis_exporter:v1.95.0-alpine
    restart: unless-stopped
    entrypoint: ['sh', '/etc/redis-scripts/redis.sh', 'exporter']
    environment:
      REDIS_ADDR: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:+/run/secrets/redis_password}
    secrets:
      - redis_password
    volumes:
      - ./redis:/etc/redis-scripts:ro
    # Hardened (docs/deployment.md, "Container hardening"): the image runs as
    # 59000:59000 and writes nothing (redis.sh reads the password, it makes no
    # file); /tmp is there for the rule that every service has one.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging: *logging

  # The backup service's markers (last success, last failure) as metrics:
  # Prometheus can't see Docker's healthcheck. Reads the backups volume only.
  backup-metrics:
    image: busybox:1.38.0
    restart: unless-stopped
    # The backup service's user (postgres, uid 70 in its Alpine image): its
    # markers are readable by it only. The volume is mounted read only.
    user: '70:70'
    command: ['sh', '/etc/backup-metrics/serve.sh']
    environment:
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-25}
    # Hardened (docs/deployment.md, "Container hardening"): serve.sh writes
    # /www (the metrics file it serves) and nothing else; /tmp is there for the
    # rule that every service has one.
    read_only: true
    tmpfs:
      - /www
      - /tmp:size=1m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ./monitoring/backup-metrics:/etc/backup-metrics:ro
      - backups:/backups:ro
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    logging: *logging

  # HTTPS through Caddy, the way users reach the API: probes
  # https://caddy:443/health/live by its Compose name (the public name may
  # have no DNS record the containers can resolve) with PROBE_HOST as the
  # TLS server name and Host header, so Caddy serves the real site and its
  # certificate. probe_success and the certificate's expiry, for the alerts.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    # An HTTP probe needs no root (ICMP would).
    user: '65534:65534'
    # Writes the module from PROBE_HOST, then starts the exporter.
    entrypoint: ['sh', '/etc/blackbox/render-config.sh']
    environment:
      PROBE_HOST: ${PROBE_HOST:-${APP_DOMAIN:-}}
    # Hardened (docs/deployment.md, "Container hardening"): it writes only
    # the module render-config.sh makes in /tmp. The binary carries no file
    # capability, so dropping them all breaks nothing (an ICMP probe would
    # need CAP_NET_RAW; the HTTP one doesn't).
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9115/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging: *logging

  # The host's disk, memory, CPU and load (on Docker Desktop: the Linux VM, whose
  # Docker.raw is what fills). Read only; the host's root is mounted at /host
  # and node-exporter reads /proc and /sys through it. Not published: only
  # Prometheus reaches it, as node-exporter:9100. On Linux this is the host; a
  # Mac itself needs a Homebrew node_exporter (docs/deployment.md, "Alerting").
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # Pseudo and container file systems are not the disk.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    # The host's process namespace: the process and load numbers are the host's.
    pid: host
    volumes:
      - /:/host:ro,rslave
    # Hardened (docs/deployment.md, "Container hardening"): the image runs as
    # `nobody` and writes nothing (it reads /proc and /sys through /host);
    # /tmp is there for the rule that every service has one.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging: *logging

  # Log shipping (docs/deployment.md, "Logs"). OFF unless the profile is
  # chosen: COMPOSE_PROFILES=logs (Loki and Alloy), or logs,grafana (and the
  # UI). Loki keeps the logs on its volume for LOKI_RETENTION.
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    profiles: [logs]
    command:
      - -config.file=/etc/loki/loki.yml
      # loki.yml reads LOKI_RETENTION.
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-720h}
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      # Chunks, index and the compactor's work files (/loki is the image's
      # own directory, owned by its user).
      - loki_data:/loki
    # Hardened (docs/deployment.md, "Container hardening"): the image runs as
    # 10001 and every path loki.yml names (and the ones Loki derives from
    # common.path_prefix: the WAL, the TSDB index and its cache, the rules)
    # sits under /loki, the volume; /tmp is there for the rule that every
    # service has one.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      # The image is distroless (no shell, no wget): the binary checks itself
      # (GET http://localhost:3100/ready), as in Grafana's own Compose file.
      test: ['CMD', '/usr/bin/loki', '-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${LOKI_CPUS:-0.5}'
          memory: ${LOKI_MEMORY:-512M}
    logging: *logging

  # Grafana Alloy (Promtail's successor) reads the stack's containers' logs
  # through the Docker API: it works with the default `local` driver and
  # with json-file (docker logs must work), not with drivers Docker can't
  # read back (syslog, gelf, awslogs, none). Mounting the socket, even read
  # only, gives Alloy the Docker API: it runs as root for that. Not published.
  alloy:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    profiles: [logs]
    depends_on:
      loki:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOG_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}
    user: '0:0'
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The read positions: a restart resumes where it stopped.
      - alloy_data:/var/lib/alloy/data
    # Hardened (docs/deployment.md, "Container hardening"): it writes the
    # volume above and nothing else; /tmp is there for the rule that every
    # service has one. The volume's directory belongs to the image's `alloy`
    # user (473, mode 770) and the process is root (the socket, above), who
    # without DAC_OVERRIDE is neither its owner nor in its group and can't
    # write there: that one capability, and no more (it also keeps the socket
    # reachable, whoever owns it on the host).
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '${ALLOY_CPUS:-0.25}'
          memory: ${ALLOY_MEMORY:-256M}
    logging: *logging

  # Optional UI over Loki (profile "grafana"; with Loki's profile too:
  # COMPOSE_PROFILES=logs,grafana). 127.0.0.1 only: reach it through an SSH
  # tunnel. GRAFANA_ADMIN_PASSWORD is required (it refuses to start without).
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    profiles: [grafana]
    entrypoint:
      - sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD is not set" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
      # Grafana installs a set of plugins at start (Explore Logs and the like,
      # into the volume) and, by default, also replaces the ones the image
      # bundles (OpenTSDB, Elasticsearch, Cloud Monitoring) with newer
      # builds: it stops each, then fails to delete its directory from the
      # read-only image. The image is the unit of update here, so it keeps
      # what it ships and what is already installed.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    # Hardened (docs/deployment.md, "Container hardening"): the image runs as
    # 472 and /run.sh starts Grafana with its log mode forced to the console,
    # so it writes /var/lib/grafana (the volume: the SQLite database, the
    # plugins it downloads) and /tmp (those downloads, SQLite's temporary
    # files). The tmpfs counts against GRAFANA_MEMORY once used.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${GRAFANA_CPUS:-0.5}'
          memory: ${GRAFANA_MEMORY:-256M}
    logging: *logging

secrets:
  metrics_token:
    environment: METRICS_TOKEN
  # The monitoring role's password: migrate (creates the role) and the
  # exporter (connects as it) read the same file.
  postgres_monitor_password:
    file: ${POSTGRES_MONITOR_PASSWORD_FILE:-./secret.empty}
  # A file, not a variable: a variable that is unset stops Compose. Point
  # ALERT_WATCHDOG_URL_FILE at a file outside the repository holding the URL.
  alert_watchdog_url:
    file: ${ALERT_WATCHDOG_URL_FILE:-./monitoring/alertmanager/watchdog-url.empty}

volumes:
  prometheus_data:
  alertmanager_data:
  # compose.prod.yaml's, where the backup service writes.
  backups:
  # Log shipping (profiles logs, grafana).
  loki_data:
  alloy_data:
  grafana_data:
