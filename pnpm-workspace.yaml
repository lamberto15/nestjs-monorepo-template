# The workspace: apps/ (the API, frontends you add) and packages/ (the typed
# client, shared code). Tasks across it run through Turborepo (turbo.json).
packages:
  - apps/*
  - packages/*
# Dependencies are pinned to exact versions (no ^ or ~): `pnpm add` saves them
# exactly, and `node tools/ci/pinned-deps.mjs` (part of `pnpm lint`) refuses ranges.
saveExact: true
overrides:
  # Patched transitive versions for advisories not yet reflected in Nest's
  # Express platform dependency ranges (2026-10).
  'body-parser@^2.0.0': 2.4.0
  'multer@^2.0.0': 2.5.0
  'node-gyp@13.1.0>undici': 8.12.2
  # @lhci/cli's chain (the web app's Lighthouse runs, web.yml): express 4
  # still asks for body-parser 1.20.8 (GHSA-27r3-jxmh-p828, fixed in 1.20.9),
  # and proxy-agent's get-uri for basic-ftp 5 (GHSA-c475-qrg2-pj4r, fixed in
  # 6.2.1; only used for ftp:// proxy configuration URLs). Drop each once
  # @lhci/cli's dependencies ask for the fixed version themselves (#1072).
  'body-parser@^1.0.0': 1.20.9
  'basic-ftp@<6.2.1': 6.2.1
  # GHSA-3f7j-7jwc-fxfj (high, fixed in 5.33.16), through
  # @opentelemetry/instrumentation-host-metrics and the CLI's dependency.
  'systeminformation@<5.33.16': 5.33.18
  # Dependabot alerts on transitive versions (2026-11). Drop each once the
  # parent asks for the fixed version itself.
  # GHSA-9wx9-5pv9-3349, GHSA-f86p-h4j2-7qgj (@tanstack/router-core, solid-js).
  'seroval@<1.6.11': 1.6.11
  'seroval-plugins@<1.6.11': 1.6.11
  # GHSA-6pq8-jhm2-2vcw (express 4, body-parser 1, superagent).
  'qs@<6.16.1': 6.17.1
  # GHSA-3g3m-2fjr-6pw4 (rimraf 5, workbox-build, the Sentry and Storybook
  # build plugins) and GHSA-g3hv-75wg-m249 (those globs, @ts-morph/common).
  'glob@>=9.0.0 <14.0.2': 14.0.4
  'minimatch@>=7.0.0 <11.0.1': 11.0.5
  # GHSA-67mh-4wv8-2f99 (esbuild's development server; drizzle-kit's loader).
  '@esbuild-kit/core-utils>esbuild': 0.25.12
allowBuilds:
  '@scarf/scarf': false
  # OpenTelemetry's OTLP transformer: the postinstall only prints a notice.
  protobufjs: false
  # drizzle-kit's bundler: its script checks the platform binary.
  esbuild: true
  # Its postinstall runs `lefthook install`, the git hooks (lefthook.yml);
  # skipped where CI=true (CI, the image build).
  lefthook: true
  # bullmq's msgpackr: optional native speedup with a prebuilt binary.
  msgpackr-extract: true
  # RE2 (custom-field patterns): its install script downloads the prebuilt
  # addon for the platform (verified against the hashes pinned in the
  # package), or builds it with node-gyp when none matches.
  re2: true
patchedDependencies:
  '@nestjs/authentication@0.1.1': patches/@nestjs__authentication@0.1.1.patch
# Exempt from pnpm's minimum release age (a new version waits before install).
# turbosheet: the owner's own library (data-transfer's Excel), published from
# its CI with npm provenance.
minimumReleaseAgeExclude:
  - systeminformation@5.33.18
  - turbosheet@0.3.0
