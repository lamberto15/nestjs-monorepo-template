# The workspace: apps/ (the API, frontends you add) and packages/ (the typed
# client, shared code). Tasks across it run through Turborepo (turbo.json).
packages:
  - apps/*
  - packages/*
# Dependencies are pinned to exact versions (no ^ or ~): `pnpm add` saves them
# exactly, and `node tools/ci/pinned-deps.mjs` (part of `pnpm lint`) refuses ranges.
saveExact: true
# exceljs 4.4.0 (its latest) still asks for uuid ^8, which has a moderate
# advisory (GHSA-w5hq-g745-h8pq, fixed in 11.1.1). It only calls v4(), through
# require(): uuid 14 is ESM, which Node 24's require() loads.
overrides:
  # Patched transitive versions for advisories not yet reflected in Nest's
  # Express platform dependency ranges (2026-10).
  'body-parser@^2.0.0': 2.4.0
  'multer@^2.0.0': 2.5.0
  'node-gyp@13.1.0>undici': 8.12.2
  'exceljs>uuid': 14.0.3
allowBuilds:
  '@scarf/scarf': false
  # OpenTelemetry's OTLP transformer: the postinstall only prints a notice.
  protobufjs: false
  # drizzle-kit's bundler: its script checks the platform binary.
  esbuild: true
  # Its postinstall runs `lefthook install`, the git hooks (lefthook.yml);
  # skipped where CI=true (CI, the image build).
  lefthook: true
  # bullmq's msgpackr: optional native speedup with a prebuilt binary.
  msgpackr-extract: true
  # RE2 (custom-field patterns): its install script downloads the prebuilt
  # addon for the platform (verified against the hashes pinned in the
  # package), or builds it with node-gyp when none matches.
  re2: true
patchedDependencies:
  '@nestjs/authentication@0.1.1': patches/@nestjs__authentication@0.1.1.patch
