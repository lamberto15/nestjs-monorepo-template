# Development: the backing services on localhost (PostgreSQL, Redis, Mailpit,
# Floci, Gotenberg); the apps run on your machine (`pnpm dev`: instant
# reloads, the debugger). `pnpm services:up` runs them as the project
# `<name>-dev`, apart from a production stack on the same machine, with
# dev/compose.env as its variables (never .env: production's secrets).
# `cp env.development.example .env.development` points the app at them.

# Bounded logs, as in compose.yaml (which covers postgres and redis).
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: '3'

services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Marks the database it creates as a development one, so the demo seed
      # may run on it (dev/postgres/10-dev-database.sql; `pnpm db:mark-dev`
      # for a volume made before).
      - ./dev/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    ports:
      - '127.0.0.1:6379:6379'

  # Catches every mail the app sends (SMTP on 1025): read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    logging: *logging
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  # AWS on http://localhost:4566 (S3 for files, SES for mail), so development
  # runs the production paths without an account. SES mail is relayed to Mailpit.
  floci:
    image: floci/floci:2.2.0-compat # compat: the AWS CLI for the init hook
    restart: unless-stopped
    logging: *logging
    environment:
      # No Docker socket here: no web console, and no Docker-backed services (Lambda, RDS…).
      FLOCI_SERVICES_UI_ENABLED: 'false'
      FLOCI_SERVICES_ECS_ENABLED: 'false' # else it waits ~15 s for Docker at start
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: '1025'
      S3_BUCKET: ${S3_BUCKET:-app-files}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
    ports:
      - '127.0.0.1:4566:4566'
    volumes:
      - floci_data:/app/data
      # Creates the bucket and verifies the sender once Floci is ready.
      - ./dev/floci:/etc/floci/init/ready.d:ro
    depends_on:
      - mailpit

  # PDF documents (docs/documents.md) on http://localhost:3100: the official
  # image as compose.prod.yaml builds on, with its flags (Chromium loads the
  # page it is given and nothing else). Unlike production it has a way out
  # (the default network, for the published port): the flags hold alone here.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1-chromium@sha256:5da4ab7b8fe7326537369e17b661be765d9a2887f77722faacdbe6d55812fb96
    restart: unless-stopped
    logging: *logging
    command:
      - gotenberg
      - --chromium-allow-list=^file:///tmp/
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-disable-javascript
      # Renders waiting beyond this answer 429 (the job retries later): a
      # burst never piles up in Gotenberg's memory.
      - --chromium-max-queue-size=20
      - --api-disable-download-from
      - --webhook-disable
      # Longer than the app's GOTENBERG_TIMEOUT_MS: the app gives up first, and retries.
      - --api-timeout=60s
      - --log-format=json
    ports:
      - '127.0.0.1:3100:3000'

volumes:
  floci_data:
