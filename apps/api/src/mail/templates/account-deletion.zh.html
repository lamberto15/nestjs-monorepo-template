<p>{{ name }}，您好：</p>
<p>
  您请求删除您的 {{ app }} 账户。账户将于
  <strong>{{ scheduledFor }}</strong>
  删除：您的个人资料、登录方式、会话和通知将一并删除；您创建的记录会保留，但不再带有您的姓名。
</p>
{{#if cancelUrl}}
<p>
  改变主意了，或者这不是您的操作？请在此之前取消删除，无需登录：<a
    href="{{ cancelUrl }}"
    >保留我的账户</a
  >。此链接仅可使用一次。
</p>
{{/if}} {{#if url}}
<p>
  在此之前，您也可以在账户页面下载您的数据副本：<a href="{{ url }}"
    >{{ url }}</a
  >
</p>
{{/if}}
