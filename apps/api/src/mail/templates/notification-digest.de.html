<p>Hallo {{ name }},</p>
<p>{{ count }} neue Benachrichtigungen in {{ app }}:</p>
{{#each items}}
<div style="margin:16px 0;padding:12px 16px;border-left:3px solid #d0d7de;">
  <strong>{{ title }}</strong><br>
  {{ body }}<br>
  <span style="color:#59636e;font-size:13px;">{{ at }}</span>{{#if url}} · <a href="{{ url }}">Öffnen</a>{{/if}}
</div>
{{/each}}
{{#if more}}<p>…und {{ more }} weitere.</p>{{/if}}
<p style="color:#59636e;font-size:13px;">Sie erhalten diese Zusammenfassung aufgrund Ihrer Benachrichtigungseinstellungen in {{ app }}.</p>
