# Sizing for a small host: 2 vCPU, 4 GB of memory (docs/deploy-swarm.md, "Sizing").
# Both of our environments use it, so staging behaves like production:
#
#   SWARM_OVERLAYS=compose.small.yaml pnpm deploy:swarm    (or the Deploy workflow)
#   COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.small.yaml   (plain Compose)
#
# Memory limits are hard caps and must fit the host: about 2.6 GiB in steady
# state and 3.1 GiB while a deploy starts the new api next to the old one
# (start-first), out of the ~3.3 GiB a 4 GB host leaves after the OS, Docker
# and Tailscale. CPU limits may add up to more than 2 (CPU is shared, not
# reserved); the reservations must fit the 2 CPUs even during a deploy, when
# Swarm reserves the new api's share next to the old one's, or the new task
# stays pending ("insufficient resources", v0.1.1's first production deploy):
# 1.4 CPU, 1.65 while deploying. Only the api starts first. Each Node.js memory limit
# follows docs/deployment.md: heap + 128 MiB + hash concurrency × 128 MiB.
# Database connections: api pool 10 + worker pool 10 + backup and migrations,
# within max_connections 50. The heavy worker, ClamAV and the monitoring stack
# don't fit next to this and stay off.
services:
  migrate:
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 384M }

  api:
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      PASSWORD_HASH_CONCURRENCY: 1
      DATABASE_POOL_MAX: 10
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '1', memory: 512M } # 256 + 128 + 1 × 128
        # 0.25, not more: reserved twice while a deploy runs both apis.
        reservations: { cpus: '0.25', memory: 384M }

  worker:
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      PASSWORD_HASH_CONCURRENCY: 1
      DATABASE_POOL_MAX: 10
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '1', memory: 512M } # 256 + 128 + 1 × 128
        reservations: { cpus: '0.25', memory: 384M }
      # No room for a second worker during a deploy: jobs wait in Redis for
      # the few seconds the new one takes to start.
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first

  postgres:
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=384MB
      # What the planner may assume the kernel caches: about the cap below.
      - -c
      - effective_cache_size=1200MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      # Bulk writes (imports, bulk upserts): fewer forced checkpoints, which
      # wrote the same pages again and again at the default 1 GB, and less WAL.
      # `on` (pglz) is built into every PostgreSQL; a value the server can't
      # read would stop it, and it stops first on an update.
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=on
    deploy:
      resources:
        # The cap is mostly the kernel's cache of the database's files, which
        # cgroups charge to this container: at 640 MB it held 589 MB of cache
        # and evicted pages 20 million times while the host had 2.3 GB free.
        # The kernel takes that cache back under pressure; what it can't take
        # back (shared_buffers, the connections) is the reservation, which is
        # what CI's sizing check budgets for PostgreSQL.
        limits: { cpus: '1', memory: 1600M }
        reservations: { cpus: '0.5', memory: 704M }

  redis:
    environment:
      REDIS_MAXMEMORY: 112mb
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 160M }
        reservations: { cpus: '0.1', memory: 128M }

  caddy:
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }
        reservations: { cpus: '0.1', memory: 64M }

  gotenberg:
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 256M }
      # No room for a second Chromium during a deploy: PDF rendering waits the
      # few seconds the new one takes to start (the api retries it).
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first

  backup:
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 160M }
        reservations: { cpus: '0.05', memory: 64M }
