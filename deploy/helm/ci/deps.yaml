# PostgreSQL and Redis for the smoke test only (the chart expects them to exist).
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          resources:
            requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi }
            limits: { memory: 512Mi, ephemeral-storage: 1Gi }
          env:
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_PASSWORD, value: ci }
            - { name: POSTGRES_DB, value: app }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, app, -d, app] }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          resources:
            requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi }
            limits: { memory: 512Mi, ephemeral-storage: 1Gi }
          args:
            [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
