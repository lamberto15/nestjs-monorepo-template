{{- if .Values.web.enabled }}
{{- $filesOrigins := include "app.webFilesOrigins" . }}
# caddy/Caddyfile without the API proxy and TLS: the Ingress routes the API's
# paths and ends TLS, so this Caddy only serves the built web app (/srv/web,
# in the published Caddy image, its /assets precompressed). The headers, the
# compression and the handles are the Caddyfile's web app, line for line
# (caddy/caddyfile.test.mjs compares them; the Helm workflow runs it);
# connect-src and img-src also name the origins the browser reaches for
# files: the bucket of env.S3_BUCKET and web.filesOrigin (app.webFilesOrigins,
# helpers).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-web
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {
      admin off
      auto_https off
      persist_config off
    }
    :8080 {
      root * /srv/web
      header {
        Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'{{ with $filesOrigins }} {{ . }}{{ end }}; img-src 'self' data: blob:{{ with $filesOrigins }} {{ . }}{{ end }}; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        X-Frame-Options "DENY"
        X-Content-Type-Options "nosniff"
        Referrer-Policy "strict-origin-when-cross-origin"
        Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self), publickey-credentials-create=(self)"
        Strict-Transport-Security "max-age=63072000; includeSubDomains"
        Cross-Origin-Opener-Policy "same-origin"
      }
      encode zstd gzip
      handle /healthz {
        respond "ok" 200
      }
      handle /version.json {
        header Cache-Control "no-store"
        file_server
      }
      handle /assets/* {
        @asset file
        header @asset Cache-Control "public, max-age=31536000, immutable"
        file_server {
          precompressed br gzip
        }
      }
      handle {
        header Cache-Control "no-cache"
        try_files {path} /index.html
        file_server
      }
    }
{{- end }}
