{{- if .Values.ingress.enabled }}
{{- /*
Two Ingresses: the API's Exact paths in "<fullname>-exact", the Prefix ones
and the web app in "<fullname>". Traefik names a router after the Ingress
and the path with its punctuation dropped, so /health (Exact) and /health/
(Prefix) in one Ingress would be one router; a second Ingress keeps their
names apart. Traefik also orders routers by the length of their rule, so the
web app's PathPrefix(`/`) outranks Path(`/api`) and Path(`/files`): the
Exact Ingress gets a priority above every other (other controllers ignore it).
*/}}
{{- range $exact := list false true }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" $ }}{{ if $exact }}-exact{{ end }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  {{- /* cert-manager's annotations on the first only: one Certificate per secret. */}}
  {{- $annotations := dict }}
  {{- if $exact }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.priority" "1000" }}
  {{- end }}
  {{- range $key, $value := $.Values.ingress.annotations }}
  {{- if not (and $exact (hasPrefix "cert-manager.io/" $key)) }}
  {{- $_ := set $annotations $key $value }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- /* The app's domain, then the tenants' verified custom domains (customDomains). */}}
  {{- $custom := ternary $.Values.customDomains.hosts (list) $.Values.customDomains.enabled }}
  {{- $hosts := prepend $custom (required "set domain" $.Values.domain) }}
  {{- if or $.Values.ingress.tlsSecretName (and $custom $.Values.customDomains.tlsSecretName) }}
  tls:
    {{- if $.Values.ingress.tlsSecretName }}
    - hosts:
        - {{ $.Values.domain | quote }}
      secretName: {{ $.Values.ingress.tlsSecretName }}
    {{- end }}
    {{- if and $custom $.Values.customDomains.tlsSecretName }}
    - hosts:
        {{- range $custom }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ $.Values.customDomains.tlsSecretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $host := $hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $.Values.ingress.apiPaths }}
          {{- if eq (eq .pathType "Exact") $exact }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "app.fullname" $ }}-api
                port:
                  number: 3000
          {{- end }}
          {{- end }}
          {{- if and $.Values.web.enabled (not $exact) }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.fullname" $ }}-web
                port:
                  number: 80
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
