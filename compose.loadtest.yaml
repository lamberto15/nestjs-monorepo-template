# The load test's stack (docs/development.md, "Load tests"): the production
# stack (compose.yaml + compose.prod.yaml: api ×API_REPLICAS, which
# loadtest/run.sh sets from LOADTEST_REPLICAS, worker,
# migrate, PostgreSQL, Redis, the same image and limits) with only what a
# throwaway run on a GitHub runner or a laptop can't have changed here.
# loadtest/run.sh starts it under its own project name (never the deployed
# one) with its own env file, then runs k6 inside its network.
#
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.loadtest.yaml
#
# Not for a real deployment: it raises every rate limit, and the app accepts
# that only with APP_ENV=loadtest, set here.

services:
  api:
    environment:
      GOTENBERG_URL: ''
      # Names this stack in logs, and lets it raise the rate limits: under
      # NODE_ENV=production the app refuses RATE_LIMIT_MULTIPLIER above 1
      # without it.
      APP_ENV: loadtest
      # Every request comes from k6's one address, and the same accounts sign
      # in many times a minute: the limits are raised (×1000), never turned
      # off, so the throttler still runs (and costs) what it does in production.
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1000}
      # The bot check (roadmap item 4) is off unless LOADTEST_CAPTCHA asks for
      # it (loadtest/run.sh): the default run measures the app, not a captcha.
      # LOADTEST_CAPTCHA=always puts the guard in place with the stub
      # provider, which judges by the token's text and calls nothing, so its
      # cost is the guard's own. The app accepts the stub under
      # NODE_ENV=production only with APP_ENV=loadtest, set above
      # (docs/auth.md, "Bot protection"); no Turnstile key is here.
      CAPTCHA_MODE: ${LOADTEST_CAPTCHA:-off}
      CAPTCHA_PROVIDER: stub
  worker:
    environment:
      APP_ENV: loadtest
      # No PDFs in the scenarios: documents off, and no Gotenberg image to
      # build or pull (it is in no request path).
      GOTENBERG_URL: ''
  migrate:
    environment:
      APP_ENV: loadtest

  # Plain HTTP inside the network, no published port: the production Caddy
  # needs a Cloudflare token and a public name for its certificate. The same
  # Caddy release (caddy/Dockerfile) and the same load balancing
  # (loadtest/Caddyfile), without TLS.
  caddy:
    image: caddy:2.11.7
    # The stock test image retains its file capability; production removes it.
    cap_add: [NET_BIND_SERVICE]
    build: !reset null
    ports: !reset []
    secrets: !reset []
    environment: !reset {}
    # compose.prod.yaml's Caddy is read_only (docs/deployment.md, "Container
    # hardening") and writes /data and /config on volumes. The stock image
    # declares no VOLUME there, so without these two the paths sit on the
    # read-only root filesystem and Caddy logs "read-only file system"
    # (instance ID, storage clean lock). The list replaces the production
    # one (its Caddyfile), so they are named again; `down --volumes` removes
    # them.
    volumes: !override
      - ./loadtest/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Not in the request path; its image would only lengthen the run.
  backup:
    profiles: [backup]
  gotenberg:
    profiles: [documents]
