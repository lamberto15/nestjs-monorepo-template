# The web app's checks that need more than CI / CD gives a pull request
# (docs/monorepo.md, "The web app"): the local-file analytics in Firefox and
# WebKit, and Lighthouse CI (a report, never a failure). The bundle budget,
# Storybook and the analytics in Chromium run in ci.yml (check, e2e-web) on
# every web change. Here: pull requests that touch the analytics engine or
# its libraries, main, the nightly run and a manual one.
#
# Third-party actions are pinned by commit SHA (the comment names the
# release); Dependabot proposes newer ones.
name: Web

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/web/src/features/analytics/**'
      - 'apps/web-e2e/scripts/analytics-smoke.mjs'
      - 'apps/web/package.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/src/features/analytics/**'
      - 'apps/web-e2e/scripts/analytics-smoke.mjs'
      - 'apps/web/package.json'
      - '.github/workflows/web.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The local-file analytics (DuckDB-WASM in a worker, no external request)
  # in the engines besides Chromium, which CI's e2e-web job runs on every
  # web change.
  analytics-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Build the shared API client
        run: pnpm --filter @nestjs-monorepo-template/api-client build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @nestjs-monorepo-template/web-e2e exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
            pnpm --filter @nestjs-monorepo-template/web-e2e exec playwright install-deps ${{ matrix.browser }}
          else
            pnpm --filter @nestjs-monorepo-template/web-e2e exec playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Local file analytics without external requests
        env:
          ANALYTICS_BROWSER: ${{ matrix.browser }}
        run: |
          pnpm --filter @nestjs-monorepo-template/web exec vite --host 127.0.0.1 --port 5178 > "$RUNNER_TEMP/analytics-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          pnpm --filter @nestjs-monorepo-template/web-e2e exec node scripts/analytics-smoke.mjs
      - name: Vite diagnostics
        if: failure()
        run: cat "$RUNNER_TEMP/analytics-vite.log"

  # A report first (assertions are warnings): the scores are in the summary and
  # the reports in the artifact; nothing fails.
  lighthouse:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@69aec4f8e0792a339e9181bc38e07f4990ded015 # v2.3.12
      - name: Lighthouse CI on the built app
        run: pnpm turbo run lighthouse --filter=@nestjs-monorepo-template/web
      - name: Scores in the job summary
        if: ${{ !cancelled() }}
        working-directory: apps/web/.lighthouseci
        run: |
          {
            echo '### Lighthouse (non-blocking)'
            echo
            echo '| Performance | Accessibility | Best practices |'
            echo '| --- | --- | --- |'
            for f in lhr-*.json; do
              jq -r '[.categories.performance.score, .categories.accessibility.score, .categories["best-practices"].score] | map(. * 100 | round) | "| \(.[0]) | \(.[1]) | \(.[2]) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/web/.lighthouseci/
          retention-days: 14
