# The web app's checks that need more than CI / CD gives a pull request
# (docs/monorepo.md, "The web app"): the Data Explorer's browser spec in
# Firefox and WebKit, and Lighthouse CI (a report, never a failure). The
# bundle budget, Storybook and the same spec in Chromium run in ci.yml (check,
# e2e-web) on every web change. Here: pull requests that touch the analytics
# engine, its libraries, the build config, the production Content-Security-
# Policy it runs under or the spec, main, the nightly run and a manual one.
#
# Third-party actions are pinned by commit SHA (the comment names the
# release); Dependabot proposes newer ones.
name: Web

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/web/src/features/analytics/**'
      - 'apps/web/package.json'
      - 'apps/web/vite.config.ts'
      - 'apps/web/preview-headers.ts'
      - 'apps/web/public/duckdb-extensions/**'
      - 'apps/web-e2e/test/analytics*'
      - 'apps/web-e2e/playwright.config.ts'
      - 'caddy/Caddyfile'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/src/features/analytics/**'
      - 'apps/web/package.json'
      - 'apps/web/vite.config.ts'
      - 'apps/web/preview-headers.ts'
      - 'apps/web/public/duckdb-extensions/**'
      - 'apps/web-e2e/test/analytics*'
      - 'apps/web-e2e/playwright.config.ts'
      - 'caddy/Caddyfile'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Data Explorer's browser spec (apps/web-e2e/test/analytics.spec.ts) in
  # the engines besides Chromium, which CI's e2e-web job runs with the other
  # browser tests. The same stack as e2e-web (docs/development.md, "Browser
  # tests"): the built web app, served by `vite preview` under Caddy's
  # production Content-Security-Policy, and the built API on PostgreSQL and
  # Redis. Only the setup project (the sign-in, in the runner's Chrome) and the
  # one analytics project run (playwright.config.ts, E2E_EXTRA_BROWSERS).
  analytics-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      E2E_BROWSER_CHANNEL: chrome
      E2E_EXTRA_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      # compose.yaml's pinned images, started as `pnpm services:up` starts them
      # (the development database is marked as such: the demo seed needs it).
      - name: PostgreSQL and Redis
        run: docker compose -p web-e2e --env-file dev/compose.env -f compose.yaml -f compose.dev.yaml up -d --wait postgres redis
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @nestjs-monorepo-template/web-e2e exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        # Its system libraries come from the runner's Ubuntu mirror, which has
        # stalled mid-download: sometimes a hung connection (apt's own timeout
        # and retries recover it), sometimes a slow trickle apt never gives up
        # on. Each attempt is capped; a capped or failed one switches to the
        # main Ubuntu mirror and tries again. The step limit turns a real outage
        # into a clear failure.
        timeout-minutes: 12
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network
          for attempt in 1 2 3; do
            if timeout 180 pnpm --filter @nestjs-monorepo-template/web-e2e exec playwright install-deps ${{ matrix.browser }}; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::The browser's system libraries did not install after 3 attempts"
              exit 1
            fi
            echo "::warning::Attempt $attempt to install the system libraries failed or stalled; switching to archive.ubuntu.com"
            # A capped attempt can leave its apt-get (run under sudo) behind.
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
            # Only the host changes; apt verifies the archive's signatures either way.
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>&1 || true
          done
          if [ "${{ steps.browsers.outputs.cache-hit }}" != true ]; then
            pnpm --filter @nestjs-monorepo-template/web-e2e exec playwright install ${{ matrix.browser }}
          fi
      - name: Local file analytics without external requests
        run: pnpm test:e2e:web --project=setup --project=analytics-${{ matrix.browser }}
        env:
          CI: 'true'
          # WebKit drops Secure cookies on http://localhost (Chromium and Firefox
          # keep them), so the signed-in state never reaches the page there. Its
          # leg runs the API with the test-only plain `sid` cookie
          # (SESSION_COOKIE_SECURE, docs/configuration.md); Firefox and e2e-web
          # keep testing the production `__Host-sid` one.
          SESSION_COOKIE_SECURE: ${{ matrix.browser == 'webkit' && 'off' || 'on' }}
      - name: The HTML report and traces
        if: ${{ !cancelled() && (failure() || hashFiles('apps/web-e2e/test-results/**/trace.zip') != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/web-e2e/playwright-report/
            apps/web-e2e/test-results/
          retention-days: 14

  # A report first (assertions are warnings): the scores are in the summary and
  # the reports in the artifact; nothing fails.
  lighthouse:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Lighthouse CI on the built app
        run: pnpm turbo run lighthouse --filter=@nestjs-monorepo-template/web
      - name: Scores in the job summary
        if: ${{ !cancelled() }}
        working-directory: apps/web/.lighthouseci
        run: |
          {
            echo '### Lighthouse (non-blocking)'
            echo
            echo '| Performance | Accessibility | Best practices |'
            echo '| --- | --- | --- |'
            for f in lhr-*.json; do
              jq -r '[.categories.performance.score, .categories.accessibility.score, .categories["best-practices"].score] | map(. * 100 | round) | "| \(.[0]) | \(.[1]) | \(.[2]) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/web/.lighthouseci/
          retention-days: 14
