# Scratch branch only, never merged: prints SonarCloud data to the job log
# (sonarcloud.io is unreachable from the cloud sessions that work issues #470
# and #471). Deleted with its branch.
name: sonar-export

on:
  push:
    branches: [sonar-export]

permissions:
  pull-requests: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://sonarcloud.io/api
      KEY: lamberto15_nestjs-monorepo-template
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Each open pull request's gate, new issues and duplicated lines
        run: |
          for pr in $(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number'); do
            echo "##### PR $pr"
            curl -fsS --retry 3 "$API/qualitygates/project_status?projectKey=$KEY&pullRequest=$pr" \
              | jq -r '.projectStatus | "gate \(.status): " + ([.conditions[] | select(.status != "OK") | "\(.metricKey)=\(.actualValue)"] | join(", "))' || continue
            curl -fsS --retry 3 "$API/issues/search?componentKeys=$KEY&pullRequest=$pr&resolved=false&ps=500" \
              | jq -r '.issues[] | "ISSUE \(.rule) | \(.component | sub("^[^:]*:"; "")):\(.line // 0) | \(.message)"'
            curl -fsS --retry 3 "$API/measures/component_tree?component=$KEY&pullRequest=$pr&metricKeys=new_duplicated_lines&qualifiers=FIL&ps=500" > tree.json
            for f in $(jq -r '.components[] | select(any(.measures[]; (.periods[0].value // "0") != "0")) | .key' tree.json); do
              curl -fsS --retry 3 -G "$API/duplications/show" --data-urlencode "key=$f" --data-urlencode "pullRequest=$pr" \
                | jq -r '.files as $files | .duplications[] | "DUP " + ([.blocks[] | "\($files[.["_ref"]].name // .["_ref"]):\(.from)+\(.size)"] | join("  ==  "))'
            done
          done
