# The restore drill (docs/deployment.md, "Backups and restore", "Restore
# drill"): a backup nobody has restored is a hope. Weekly (and on demand), the
# production stack on a GitHub runner (the load test's Compose project and
# env file, compose.loadtest.yaml on top) writes data, takes a backup with the
# backup service's own script, destroys PostgreSQL's volume, restores the dump
# into the new cluster with `restore`, compares the row count of every table,
# starts the app on it and signs in. The durations go to the job summary. A
# failed run is the alert: GitHub mails the repository's watchers and the run
# shows red.
#
# - schedule: Mondays 03:17 UTC, on main.
# - workflow_dispatch: a run now.
# - pull_request (the drill's own files only): the same run, to prove a change
#   to the scripts still restores.
name: Restore drill

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - backup/**
      - scripts/restore-drill.sh
      - loadtest/run.sh
      - compose.loadtest.yaml
      - compose.prod.yaml
      - .github/workflows/restore-drill.yml

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  restore-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image CI builds, built again here without a cache: reading CI's
      # (type=gha) took 114-147 s at the median, Helm's uncached build of the
      # same Dockerfile 95 s with its `kind load` (issue #686). Docker's own
      # BuildKit, loaded for Compose as is.
      - name: Build the production image
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker build -f apps/api/Dockerfile --build-arg GIT_SHA -t app:restore-drill .

      - name: Back up, destroy, restore, check
        env:
          APP_IMAGE: app:restore-drill
          GIT_SHA: ${{ github.sha }}
        run: scripts/restore-drill.sh
