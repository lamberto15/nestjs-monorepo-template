      - name: Load the verified image
        run: |
          (cd "${{ runner.temp }}/image" && sha256sum -c caddy.tar.sha256)
          docker load -i "${{ runner.temp }}/image/caddy.tar"
          test "$(docker image inspect --format '{{.Id}}' caddy:ci)" = "$(cat "${{ runner.temp }}/image/caddy.id")"
      - name: Tags for the verified image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/caddy
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push without rebuilding
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPOSITORY: ghcr.io/${{ github.repository }}/caddy
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag caddy:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          # Resolve the immutable SHA tag just pushed; never a mutable branch tag.
          ref="${REPOSITORY,,}:$GITHUB_SHA"
          digest=$(docker inspect --format '{{json .RepoDigests}}' "$ref" | jq -er --arg repo "${REPOSITORY,,}@" '.[] | select(startswith($repo)) | split("@")[1]')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=${REPOSITORY,,}@$digest" >> "$GITHUB_OUTPUT"
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - name: No fixable high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.push.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy
      - name: Sign the image, attest its provenance and SBOM
        uses: ./.github/actions/sign-image
        with:
          image: ghcr.io/${{ github.repository }}/caddy
          digest: ${{ steps.push.outputs.digest }}

  release-manifest:
    name: Verify release manifest
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' && needs.changes.outputs.publish == 'true'
    needs: [changes, ci-gate, publish, publish-caddy, publish-gotenberg]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      api: ${{ steps.manifest.outputs.api }}
      caddy: ${{ steps.manifest.outputs.caddy }}
      gotenberg: ${{ steps.manifest.outputs.gotenberg }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: release-plan
      - name: Require affected publication to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FLAGS: ${{ toJSON(needs.changes.outputs) }}
          PLAN_FILE: release-plan/plan.json
        run: node tools/ci/publication-gate.mjs
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR for evidence verification
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reuse evidence and assemble the immutable image set
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: >-
            {"api":"${{ needs.publish.outputs.digest }}","caddy":"${{ needs.publish-caddy.outputs.digest }}","gotenberg":"${{ needs.publish-gotenberg.outputs.digest }}"}
        run: node tools/ci/release-manifest.mjs
      - name: Preserve successful release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-v1
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      [ci-gate, publish, publish-gotenberg, publish-caddy, release-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Every commit and tag: the previous release and the changes since it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-manifest-v1
      - name: Install Node.js (the notes have no dependencies)
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          install: false
      # The notes hold commit subjects and pull request titles: they go to
      # files and the release, never to the log.
      - name: The release and its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE_VERSION: ${{ needs.publish.outputs.version }}
          APP_DIGEST: ${{ needs.publish.outputs.digest }}
          GOTENBERG_DIGEST: ${{ needs.publish-gotenberg.outputs.digest }}
          CADDY_DIGEST: ${{ needs.publish-caddy.outputs.digest }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          previous=$(node tools/release/notes.mjs --tag "$TAG" --print-previous)
          echo "Release $TAG, after ${previous:-no earlier release}"
          fields=(-f "tag_name=$TAG")
          if [ -n "$previous" ]; then fields+=(-f "previous_tag_name=$previous"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${fields[@]}" --jq .body > "$dir/changes.md"
          node tools/release/notes.mjs --tag "$TAG" --previous "${previous:-none}" \
            --image-version "$IMAGE_VERSION" --app-digest "$APP_DIGEST" --gotenberg-digest "$GOTENBERG_DIGEST" --caddy-digest "$CADDY_DIGEST" \
            --changes "$dir/changes.md" --out "$dir/notes.md"
          if gh release view "$TAG" --json tagName --jq .tagName > "$dir/existing" 2>&1; then
            gh release edit "$TAG" --notes-file "$dir/notes.md"
          else
            flags=()
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$dir/notes.md" "${flags[@]}"
          fi
          gh release upload "$TAG" release-manifest.json --clobber

  # The three digests come from this run's tested, scanned publish jobs. Only a
  # successful push to main can request the protected production environment;
  # no PR or tag run can reach the cluster. Off-server backups are optional and
  # are not a prerequisite when an operator has chosen a strict zero-cost setup.
  deploy-k3s:
    # Deliberately disabled by #629 until separate rollout review and green CI.
    if: ${{ false && github.event_name == 'push' && vars.K3S_DEPLOY_ENABLED == 'true' }}
    needs: [ci-gate, release-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: production-k3s
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Tailscale workload identity federation
    env:
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      APP_URL: ${{ vars.APP_URL }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the CI image digests
        env:
          APP_DIGEST: ${{ needs.release-manifest.outputs.api }}
          WEB_DIGEST: ${{ needs.release-manifest.outputs.caddy }}
          GOTENBERG_DIGEST: ${{ needs.release-manifest.outputs.gotenberg }}
        run: |
          for digest in "$APP_DIGEST" "$WEB_DIGEST" "$GOTENBERG_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          done
      - name: Install Helm 4.3.1
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo '0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  helm.tar.gz' |
            (cd "$RUNNER_TEMP" && sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/helm-bin/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - name: Validate the exact production render
        env:
          APP_DIGEST: ${{ needs.release-manifest.outputs.api }}
          WEB_DIGEST: ${{ needs.release-manifest.outputs.caddy }}
          GOTENBERG_DIGEST: ${{ needs.release-manifest.outputs.gotenberg }}
        run: |
          test -n "$APP_DOMAIN" && test -n "$APP_URL" && test -n "$MAIL_FROM"
          test "$APP_URL" = "https://$APP_DOMAIN"
          helm version --short
          helm lint deploy/helm/app --strict \
            -f deploy/helm/app/values.single-node.yaml \
            --set image.digest="$APP_DIGEST" \
            --set web.image.digest="$WEB_DIGEST" \
            --set gotenberg.image.digest="$GOTENBERG_DIGEST" \
            --set-string domain="$APP_DOMAIN" \
            --set-string env.WEB_URL="$APP_URL" \
            --set-string env.CORS_ORIGINS="$APP_URL" \
            --set-string env.MAIL_FROM="$MAIL_FROM"
          helm template app deploy/helm/app \
            -n nestjs-monorepo \
            -f deploy/helm/app/values.single-node.yaml \
            --set image.digest="$APP_DIGEST" \
            --set web.image.digest="$WEB_DIGEST" \
            --set gotenberg.image.digest="$GOTENBERG_DIGEST" \
            --set-string domain="$APP_DOMAIN" \
            --set-string env.WEB_URL="$APP_URL" \
            --set-string env.CORS_ORIGINS="$APP_URL" \
            --set-string env.MAIL_FROM="$MAIL_FROM" > "$RUNNER_TEMP/app.yaml"
          for digest in "$APP_DIGEST" "$WEB_DIGEST" "$GOTENBERG_DIGEST"; do
            grep -Fq "@$digest" "$RUNNER_TEMP/app.yaml"
          done
          for value in "$APP_DOMAIN" "$APP_URL" "$MAIL_FROM"; do
            grep -Fq "$value" "$RUNNER_TEMP/app.yaml"
          done
      - name: Join the deployment tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-k3s-deploy
          version: 1.104.2
      - name: Use the namespace-scoped kubeconfig
        env:
          K3S_KUBECONFIG: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$K3S_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Check namespace and prerequisite Secret
        run: |
          test "$(kubectl -n nestjs-monorepo auth can-i create deployments)" = yes
          test "$(kubectl -n nestjs-monorepo auth can-i create clusterrolebindings)" = no
          for verb in get list watch create update patch delete; do
            if [ "$(kubectl -n nestjs-monorepo auth can-i "$verb" prometheusrules.monitoring.coreos.com)" != yes ]; then
              echo "::error::github-deployer cannot $verb PrometheusRules; apply deploy/k3s/deployer-rbac.yaml as a cluster administrator"
              exit 1
            fi
          done
          kubectl -n nestjs-monorepo get secret app-secrets -o json |
            jq -e '.data as $data | ["database_url", "database_owner_url", "database_maintenance_url", "jwt_secret", "mfa_encryption_keys", "data_encryption_keys", "blind_index_keys", "redis_password", "mail_api_key", "metrics_token"] | all(. as $key | $data[$key] != null)' > /dev/null
          kubectl -n nestjs-monorepo rollout status statefulset/postgres --timeout=2m
          kubectl -n nestjs-monorepo rollout status statefulset/redis --timeout=2m
      - name: Upgrade to the CI-verified release
        env:
          APP_DIGEST: ${{ needs.release-manifest.outputs.api }}
          WEB_DIGEST: ${{ needs.release-manifest.outputs.caddy }}
          GOTENBERG_DIGEST: ${{ needs.release-manifest.outputs.gotenberg }}
        run: |
          helm upgrade --install app deploy/helm/app \
            --namespace nestjs-monorepo \
            --rollback-on-failure --wait=legacy --wait-for-jobs --timeout 12m \
            --history-max 10 \
            -f deploy/helm/app/values.single-node.yaml \
            --set image.digest="$APP_DIGEST" \
            --set web.image.digest="$WEB_DIGEST" \
            --set gotenberg.image.digest="$GOTENBERG_DIGEST" \
            --set-string domain="$APP_DOMAIN" \
            --set-string env.WEB_URL="$APP_URL" \
            --set-string env.CORS_ORIGINS="$APP_URL" \
            --set-string env.MAIL_FROM="$MAIL_FROM"
      - name: Verify API rollout
        run: kubectl -n nestjs-monorepo rollout status deployment/app-api --timeout=3m
      - name: Verify web rollout
        run: kubectl -n nestjs-monorepo rollout status deployment/app-web --timeout=3m
      - name: Verify worker rollout
        run: kubectl -n nestjs-monorepo rollout status deployment/app-worker --timeout=3m
      - name: Verify Gotenberg rollout
        run: kubectl -n nestjs-monorepo rollout status deployment/app-gotenberg --timeout=3m
