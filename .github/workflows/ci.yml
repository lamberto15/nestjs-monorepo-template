# The check before every merge, as the pnpm CI guide sets it up
# (https://pnpm.io/continuous-integration#github-actions): pnpm/setup installs
# pnpm (devEngines.packageManager), Node (devEngines.runtime) and the
# dependencies from the lockfile. The checks are the root's scripts: Turborepo
# (turbo.json) runs each workspace package's task, with the GitHub-native
# cache proxy sharing task artifacts between jobs and runs.
# Then the security scans, and on main and v* tags the image is published to
# GHCR (docs/deployment.md, "CI"); a v* tag then gets its GitHub release
# (docs/releases.md).
#
# Runners are the scarce resource (docs/ci-runtime.md): a job exists where
# it needs a runner of its own (services, a browser, Docker, or minutes that
# would lengthen the critical path); quick checks ride on a job that has
# already installed the workspace.
#
# Third-party actions are pinned by commit SHA (the comment names the
# release); Dependabot proposes newer ones.
name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
    # Documentation-only merges do not need image publishing or K3s rollout.
    # Release tags and changes to deployment files remain fully validated.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '.claude/**'
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_release:
        description: 'Build and publish a complete manifest on main (no deployment)'
        type: boolean
        default: false
  # A nightly run of everything on main, the checks a pull request skips
  # included (below): new advisories in the images, the generated template.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; on main and tags a run
  # finishes, so a publish is never stopped halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub compares paths; the tested utility fails towards full validation.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      app: ${{ steps.paths.outputs.app }}
      lint: ${{ steps.paths.outputs.lint }}
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
      tools: ${{ steps.paths.outputs.tools }}
      stack: ${{ steps.paths.outputs.stack }}
      services: ${{ steps.paths.outputs.services }}
      backup: ${{ steps.paths.outputs.backup }}
      gotenberg: ${{ steps.paths.outputs.gotenberg }}
      caddy: ${{ steps.paths.outputs.caddy }}
      ci: ${{ steps.paths.outputs.ci }}
      generator: ${{ steps.paths.outputs.generator }}
      image: ${{ steps.paths.outputs.image }}
      api_image: ${{ steps.paths.outputs.api_image }}
      full: ${{ steps.paths.outputs.full }}
      base: ${{ steps.paths.outputs.base }}
      head: ${{ steps.paths.outputs.head }}
      affected: ${{ steps.paths.outputs.affected }}
      expected: ${{ steps.paths.outputs.expected }}
      publish: ${{ steps.paths.outputs.publish }}
      release_ready: ${{ steps.paths.outputs.release_ready }}
      postgres: ${{ steps.images.outputs.postgres }}
      redis: ${{ steps.images.outputs.redis }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/changes.mjs
      # CI's PostgreSQL and Redis are compose.yaml's images, read from it: they
      # can't drift apart, and Dependabot's compose.yaml updates reach CI too
      # (a change to compose.yaml runs the jobs on them: `services`).
      - name: Read the images compose.yaml runs
        id: images
        run: |
          for service in postgres redis; do
            image=$(yq ".services.$service.image" compose.yaml)
            if [ -z "$image" ] || [ "$image" = null ]; then
              echo "::error file=compose.yaml::services.$service.image is missing"
              exit 1
            fi
            echo "$service: $image"
            echo "$service=$image" >> "$GITHUB_OUTPUT"
          done
      - name: Release comparison evidence
        if: steps.paths.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: ${{ runner.temp }}/ci-release-plan/plan.json
          if-no-files-found: error
          retention-days: 7

  # Workflow-only changes require orchestration tests, not application suites.
  ci-validate:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      registry:
        image: registry:3.1.2
        ports: ['5000/tcp']
    steps:
      - uses: actions/checkout@v7
      - name: Verify change routing and workflow invariants
        run: node --test 'tools/ci/*.test.mjs'
      - name: Verify image publication against a disposable local registry
        env:
          REQUIRE_DOCKER: 'true'
          CI_REGISTRY_ADDRESS: 127.0.0.1:${{ job.services.registry.ports['5000'] }}
        run: node --test tools/ci/image-publication.test.mjs
      - name: Validate GitHub Actions syntax
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 predates GitHub's documented service `command` key.
          "$RUNNER_TEMP/actionlint" -shellcheck= -ignore 'unexpected key "command" for "services" section'
      - name: Validate mixed release digests with Helm
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo '0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  helm.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          PATH="$RUNNER_TEMP/linux-amd64:$PATH" REQUIRE_HELM=true node --test tools/ci/release-helm.test.mjs

  # The production stack's configuration, rendered (no image is built): its
  # secrets (docs/deployment.md, "Secrets in files") with the values in .env
  # as before, and with every one in a file, as Compose renders them (the
  # monitoring stack too); the hardening of every service; then the shell
  # readers in their images, and the Swarm stack. The app booting on files:
  # secret-files.e2e-spec.ts.
  stack-config:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml:compose.monitoring.yaml
      METRICS_TOKEN: metrics-token-for-ci-only
    steps:
      - uses: actions/checkout@v7
      - name: Secrets as variables, as an existing .env has them
        run: |
          export APP_DOMAIN=ci.example.com ACME_EMAIL=ci@example.com
          export CLOUDFLARE_API_TOKEN=ci POSTGRES_PASSWORD=pg-ci POSTGRES_APP_PASSWORD=app-ci POSTGRES_MAINTENANCE_PASSWORD=maint-ci REDIS_PASSWORD=redis-ci POSTGRES_MONITOR_PASSWORD=mon-ci POSTGRES_REPORTING_PASSWORD=rep-ci BACKUP_ENCRYPTION_KEY=age1ci
          docker compose config --format json > env.json
          # The app role for api and worker; the owner on migrate only (docs/deployment.md, "Database roles").
          test "$(jq -r .services.api.environment.DATABASE_URL env.json)" = 'postgres://app_runtime:app-ci@postgres:5432/app'
          test "$(jq -r .services.worker.environment.DATABASE_URL env.json)" = 'postgres://app_runtime:app-ci@postgres:5432/app'
          test "$(jq -r .services.migrate.environment.DATABASE_URL env.json)" = 'postgres://app_runtime:app-ci@postgres:5432/app'
          test "$(jq -r .services.migrate.environment.DATABASE_OWNER_URL env.json)" = 'postgres://app:pg-ci@postgres:5432/app'
          test "$(jq -r .services.api.environment.DATABASE_URL_FILE env.json)" = ''
          test "$(jq -r .services.migrate.environment.DATABASE_OWNER_URL_FILE env.json)" = ''
          for service in api worker; do
            test "$(jq -r ".services.$service.environment | has(\"DATABASE_OWNER_URL\")" env.json)" = false
            test "$(jq -r ".services.$service.environment | has(\"DATABASE_OWNER_URL_FILE\")" env.json)" = false
            test "$(jq -r ".services.$service.secrets | map(.source) | index(\"database_owner_url\")" env.json)" = null
          done
          test "$(jq -r '.services.migrate.secrets | map(.source) | sort | join(",")' env.json)" = 'database_maintenance_url,database_owner_url,database_url,postgres_monitor_password,postgres_reporting_password'
          # The maintenance role (BYPASSRLS) on migrate and the worker, never api (docs/tenancy.md, "The bypass").
          test "$(jq -r .services.worker.environment.DATABASE_MAINTENANCE_URL env.json)" = 'postgres://app_maintenance:maint-ci@postgres:5432/app'
          test "$(jq -r .services.migrate.environment.DATABASE_MAINTENANCE_URL env.json)" = 'postgres://app_maintenance:maint-ci@postgres:5432/app'
          test "$(jq -r '.services.api.environment | has("DATABASE_MAINTENANCE_URL")' env.json)" = false
          test "$(jq -r '.services.api.environment | has("DATABASE_MAINTENANCE_URL_FILE")' env.json)" = false
          test "$(jq -r '.services.api.secrets | map(.source) | index("database_maintenance_url")' env.json)" = null
          test "$(jq -r '.services.worker.secrets | map(.source) | index("database_maintenance_url") != null' env.json)" = true
          # The monitoring role: migrate makes it, the exporter connects as it; nobody else sees its password.
          test "$(jq -r .services.migrate.environment.POSTGRES_MONITOR_PASSWORD env.json)" = mon-ci
          test "$(jq -r .services.migrate.environment.POSTGRES_MONITOR_USER env.json)" = app_monitor
          for service in api worker; do
            test "$(jq -r ".services.$service.environment | has(\"POSTGRES_MONITOR_PASSWORD\")" env.json)" = false
            test "$(jq -r ".services.$service.environment | has(\"POSTGRES_MONITOR_PASSWORD_FILE\")" env.json)" = false
            test "$(jq -r ".services.$service.secrets | map(.source) | index(\"postgres_monitor_password\")" env.json)" = null
          done
          # The reporting role (platform analytics): migrate makes it; no service of the stack connects as it.
          test "$(jq -r .services.migrate.environment.POSTGRES_REPORTING_PASSWORD env.json)" = rep-ci
          test "$(jq -r .services.migrate.environment.POSTGRES_REPORTING_USER env.json)" = app_reporting
          for service in api worker; do
            test "$(jq -r ".services.$service.environment | has(\"POSTGRES_REPORTING_PASSWORD\")" env.json)" = false
            test "$(jq -r ".services.$service.secrets | map(.source) | index(\"postgres_reporting_password\")" env.json)" = null
          done
          test "$(jq -r .services.postgres.environment.POSTGRES_PASSWORD env.json)" = pg-ci
          test "$(jq -r .services.backup.environment.PGPASSWORD env.json)" = pg-ci
          # The backup's encryption recipients: the variable reaches the backup, the file variable stays empty.
          test "$(jq -r .services.backup.environment.BACKUP_ENCRYPTION_KEY env.json)" = age1ci
          test "$(jq -r .services.backup.environment.BACKUP_ENCRYPTION_KEY_FILE env.json)" = ''
          test "$(jq -r .services.caddy.environment.CLOUDFLARE_API_TOKEN env.json)" = ci
          test "$(jq -r '.services["postgres-exporter"].environment.DATA_SOURCE_NAME' env.json)" = 'postgresql://app_monitor:mon-ci@postgres:5432/app?sslmode=disable'
          test "$(jq -r '.services["postgres-exporter"].secrets | map(.source) | join(",")' env.json)" = postgres_monitor_password
          test "$(jq -r '.services["redis-exporter"].environment.REDIS_PASSWORD' env.json)" = redis-ci
      - name: Every service is hardened
        # docs/deployment.md, "Container hardening": every service of the
        # rendered config is checked, so a new one without these keys fails
        # here. Rendered: compose.yaml + compose.prod.yaml, then each optional
        # overlay on top of them (all profiles on), so the job's COMPOSE_FILE
        # (which adds the monitoring stack) is set per render. Not rendered:
        # compose.pgbouncer.yaml and compose.pitr.yaml (their services aren't
        # hardened yet), the Swarm overlay (docs/deploy-swarm.md renders the
        # same files), and compose.dev.yaml and compose.loadtest.yaml
        # (development and the load test, which patch the stack).
        run: |
          export APP_DOMAIN=ci.example.com ACME_EMAIL=ci@example.com
          export CLOUDFLARE_API_TOKEN=ci POSTGRES_PASSWORD=pg-ci POSTGRES_APP_PASSWORD=app-ci POSTGRES_MAINTENANCE_PASSWORD=maint-ci REDIS_PASSWORD=redis-ci POSTGRES_MONITOR_PASSWORD=mon-ci POSTGRES_REPORTING_PASSWORD=rep-ci
          # The documented exceptions: a service and the keys it may lack
          # (read_only, cap_drop, no-new-privileges, tmpfs). Each is explained
          # where the service is (a comment in its Compose file) and in
          # docs/deployment.md, "Container hardening"; one that is no longer
          # needed fails too, so the list can't outlive its reason.
          #   prometheus: Compose refuses to create a secret that comes from a
          #   variable (METRICS_TOKEN) in a read-only service.
          exceptions='{"prometheus": ["read_only"]}'
          # The overlay's file (empty: the base stack alone) and a service it
          # adds, which the render must have: an overlay that stopped merging
          # would otherwise pass unchecked.
          check() {
            overlay=$1
            added=$2
            COMPOSE_FILE="compose.yaml:compose.prod.yaml${overlay:+:compose.$overlay.yaml}" docker compose --profile '*' config --format json > hardened.json
            test "$(jq '.services | length' hardened.json)" -gt 0
            test -z "$added" || test "$(jq --arg s "$added" '.services | has($s)' hardened.json)" = true || { echo "::error::${overlay:-the base stack}: no service $added in the render"; exit 1; }
            problems=$(jq -r --argjson exceptions "$exceptions" '
              .services | to_entries[] | .key as $service | .value as $config |
              ($exceptions[$service] // []) as $allowed |
              [
                {key: "read_only", lacks: ($config.read_only != true), message: "is not read_only"},
                {key: "cap_drop", lacks: ((($config.cap_drop // []) | index("ALL")) == null), message: "does not drop ALL capabilities"},
                {key: "no-new-privileges", lacks: ((($config.security_opt // []) | index("no-new-privileges:true")) == null), message: "lacks no-new-privileges"},
                {key: "tmpfs", lacks: ((($config.tmpfs // []) | map(select(startswith("/tmp"))) | length) != 1), message: "has no /tmp tmpfs"}
              ][] | .key as $key | ($allowed | index($key) != null) as $excepted |
              if .lacks and ($excepted | not) then "\($service) \(.message)"
              elif ($excepted and (.lacks | not)) then "\($service) has \($key), drop its exception from this step"
              else empty end
            ' hardened.json)
            if [ -n "$problems" ]; then
              while IFS= read -r problem; do echo "::error::${overlay:-base}: $problem"; done <<< "$problems"
              exit 1
            fi
          }
          check '' ''
          check clamav clamav
          # grafana has a profile: found only with every profile on.
          check monitoring grafana
          check blue-green api-blue
      # The containers get the variables compose.prod.yaml lists (no env_file):
      # APP_MODE (docs/settings.md, "Maintenance and read-only mode") must be one.
      - name: APP_MODE reaches the api and the worker
        run: |
          export APP_DOMAIN=ci.example.com ACME_EMAIL=ci@example.com
          export POSTGRES_PASSWORD=pg-ci POSTGRES_APP_PASSWORD=app-ci POSTGRES_MAINTENANCE_PASSWORD=maint-ci REDIS_PASSWORD=redis-ci POSTGRES_MONITOR_PASSWORD=mon-ci POSTGRES_REPORTING_PASSWORD=rep-ci CLOUDFLARE_API_TOKEN=ci
          APP_MODE=read-only docker compose config --format json > mode.json
          for service in api worker; do
            test "$(jq -r ".services.$service.environment.APP_MODE" mode.json)" = read-only
          done
          docker compose config --format json > mode-unset.json
          test "$(jq -r '.services.api.environment.APP_MODE' mode-unset.json)" = ''
      # The same for Caddy's maintenance page (docs/deployment.md, "Maintenance page").
      - name: MAINTENANCE_PAGE reaches Caddy
        run: |
          export APP_DOMAIN=ci.example.com ACME_EMAIL=ci@example.com
          export POSTGRES_PASSWORD=pg-ci POSTGRES_APP_PASSWORD=app-ci POSTGRES_MAINTENANCE_PASSWORD=maint-ci REDIS_PASSWORD=redis-ci POSTGRES_MONITOR_PASSWORD=mon-ci POSTGRES_REPORTING_PASSWORD=rep-ci CLOUDFLARE_API_TOKEN=ci
          MAINTENANCE_PAGE=on docker compose config --format json > page.json
          test "$(jq -r '.services.caddy.environment.MAINTENANCE_PAGE' page.json)" = on
          docker compose config --format json > page-unset.json
          test "$(jq -r '.services.caddy.environment.MAINTENANCE_PAGE' page-unset.json)" = off
      - name: Secrets in files
        run: |
          export APP_DOMAIN=ci.example.com ACME_EMAIL=ci@example.com
          dir=$(mktemp -d)
          for name in POSTGRES_PASSWORD DATABASE_URL DATABASE_OWNER_URL DATABASE_MONITOR_URL POSTGRES_MONITOR_PASSWORD POSTGRES_REPORTING_PASSWORD REDIS_PASSWORD CLOUDFLARE_API_TOKEN JWT_SECRET SMTP_URL ANTHROPIC_API_KEY BACKUP_ENCRYPTION_KEY; do
            echo ci > "$dir/$name"
            export "${name}_FILE=$dir/$name"
          done
          docker compose config --format json > files.json
          api() { jq -r ".services.api.environment.$1" files.json; }
          test "$(api DATABASE_URL)" = ''
          test "$(api DATABASE_URL_FILE)" = /run/secrets/database_url
          for service in api worker; do
            test "$(jq -r ".services.$service.environment.DATABASE_MONITOR_URL_FILE" files.json)" = /run/secrets/database_monitor_url
            test "$(jq -r ".services.$service.secrets | map(.source) | index(\"database_monitor_url\") != null" files.json)" = true
          done
          test "$(jq -r .secrets.database_monitor_url.file files.json)" = "$dir/DATABASE_MONITOR_URL"
          test "$(jq -r .services.migrate.environment.DATABASE_URL files.json)" = ''
          test "$(jq -r .services.migrate.environment.DATABASE_URL_FILE files.json)" = /run/secrets/database_url
          test "$(jq -r .services.migrate.environment.DATABASE_OWNER_URL files.json)" = ''
          test "$(jq -r .services.migrate.environment.DATABASE_OWNER_URL_FILE files.json)" = /run/secrets/database_owner_url
          test "$(jq -r .secrets.database_owner_url.file files.json)" = "$dir/DATABASE_OWNER_URL"
          # The owner's secret reaches migrate only, never api or worker.
          for service in api worker; do
            test "$(jq -r ".services.$service.environment | has(\"DATABASE_OWNER_URL_FILE\")" files.json)" = false
            test "$(jq -r ".services.$service.secrets | map(.source) | index(\"database_owner_url\")" files.json)" = null
          done
          test "$(api JWT_SECRET_FILE)" = /run/secrets/jwt_secret
          test "$(api REDIS_PASSWORD_FILE)" = /run/secrets/redis_password
          test "$(api SMTP_URL_FILE)" = /run/secrets/smtp_url
          # The AI helper's key (docs/ai.md): api and worker read it; migrate never needs it.
          test "$(api ANTHROPIC_API_KEY_FILE)" = /run/secrets/anthropic_api_key
          test "$(api ANTHROPIC_API_KEY)" = ''
          test "$(jq -r .services.worker.environment.ANTHROPIC_API_KEY_FILE files.json)" = /run/secrets/anthropic_api_key
          test "$(jq -r '.services.worker.secrets | map(.source) | index("anthropic_api_key") != null' files.json)" = true
          test "$(jq -r '.services.migrate.secrets | map(.source) | index("anthropic_api_key")' files.json)" = null
          test "$(jq -r .secrets.anthropic_api_key.file files.json)" = "$dir/ANTHROPIC_API_KEY"
          test "$(api MAIL_API_KEY_FILE)" = ''
          test "$(jq -r .secrets.jwt_secret.file files.json)" = "$dir/JWT_SECRET"
          test "$(jq -r .secrets.mail_api_key.file files.json)" = "$PWD/secret.empty"
          test "$(jq -r .services.postgres.environment.POSTGRES_PASSWORD files.json)" = ''
          test "$(jq -r .services.postgres.environment.POSTGRES_PASSWORD_FILE files.json)" = /run/secrets/postgres_password
          test "$(jq -r .services.backup.environment.PGPASSWORD_FILE files.json)" = /run/secrets/postgres_password
          # The backup's encryption recipients from a file (BACKUP_ENCRYPTION_KEY_FILE).
          test "$(jq -r .services.backup.environment.BACKUP_ENCRYPTION_KEY files.json)" = ''
          test "$(jq -r .services.backup.environment.BACKUP_ENCRYPTION_KEY_FILE files.json)" = /run/secrets/backup_encryption_key
          test "$(jq -r '.services.backup.secrets | map(.source) | index("backup_encryption_key") != null' files.json)" = true
          test "$(jq -r .secrets.backup_encryption_key.file files.json)" = "$dir/BACKUP_ENCRYPTION_KEY"
          test "$(jq -r .services.redis.environment.REDIS_PASSWORD_FILE files.json)" = /run/secrets/redis_password
          test "$(jq -r .services.caddy.environment.CLOUDFLARE_API_TOKEN_FILE files.json)" = /run/secrets/cloudflare_api_token
          test "$(jq -r '.services["postgres-exporter"].environment.DATA_SOURCE_NAME' files.json)" = ''
          test "$(jq -r '.services["postgres-exporter"].environment.DATA_SOURCE_PASS_FILE' files.json)" = /run/secrets/postgres_monitor_password
          test "$(jq -r .services.migrate.environment.POSTGRES_MONITOR_PASSWORD files.json)" = ''
          test "$(jq -r .services.migrate.environment.POSTGRES_MONITOR_PASSWORD_FILE files.json)" = /run/secrets/postgres_monitor_password
          test "$(jq -r .secrets.postgres_monitor_password.file files.json)" = "$dir/POSTGRES_MONITOR_PASSWORD"
          # The monitoring role's secret reaches migrate and the exporter only, never api or worker.
          for service in api worker; do
            test "$(jq -r ".services.$service.environment | has(\"POSTGRES_MONITOR_PASSWORD_FILE\")" files.json)" = false
            test "$(jq -r ".services.$service.secrets | map(.source) | index(\"postgres_monitor_password\")" files.json)" = null
          done
          test "$(jq -r .services.migrate.environment.POSTGRES_REPORTING_PASSWORD files.json)" = ''
          test "$(jq -r .services.migrate.environment.POSTGRES_REPORTING_PASSWORD_FILE files.json)" = /run/secrets/postgres_reporting_password
          test "$(jq -r .secrets.postgres_reporting_password.file files.json)" = "$dir/POSTGRES_REPORTING_PASSWORD"
          for service in api worker; do
            test "$(jq -r ".services.$service.environment | has(\"POSTGRES_REPORTING_PASSWORD_FILE\")" files.json)" = false
            test "$(jq -r ".services.$service.secrets | map(.source) | index(\"postgres_reporting_password\")" files.json)" = null
          done
          test "$(jq -r '.services["redis-exporter"].environment.REDIS_PASSWORD_FILE' files.json)" = /run/secrets/redis_password
          test "$(jq -r .services.alertmanager.environment.SMTP_URL_FILE files.json)" = /run/secrets/smtp_url
      # Malware scanning (docs/deployment.md, "ClamAV (malware scanning)"):
      # compose.clamav.yaml turns it on for api and worker; the blue-green
      # colours extend compose.prod.yaml's api and never see an overlay's
      # change to it, so they read .env (x-app) like every service.
      - name: Malware scanning reaches every app service
        run: |
          export APP_DOMAIN=ci.example.com ACME_EMAIL=ci@example.com
          setting() { jq -r ".services[\"$1\"].environment.$2" "$3"; }
          COMPOSE_FILE=compose.yaml:compose.prod.yaml docker compose config --format json > scan-off.json
          for service in api worker; do
            test "$(setting $service MALWARE_SCANNER scan-off.json)" = off
          done
          COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.clamav.yaml docker compose config --format json > scan-clamav.json
          for service in api worker; do
            test "$(setting $service MALWARE_SCANNER scan-clamav.json)" = clamav
            test "$(setting $service CLAMAV_HOST scan-clamav.json)" = clamav
          done
          test "$(jq -r '.services.clamav.image | startswith("clamav/clamav:")' scan-clamav.json)" = true
          # Blue-green: the colours, with the two settings in .env as the docs say.
          MALWARE_SCANNER=clamav CLAMAV_HOST=clamav COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.blue-green.yaml:compose.clamav.yaml docker compose config --format json > scan-blue-green.json
          for service in api-blue api-green worker; do
            test "$(setting $service MALWARE_SCANNER scan-blue-green.json)" = clamav
            test "$(setting $service CLAMAV_HOST scan-blue-green.json)" = clamav
          done
      - name: The shell readers of the files, in their images
        run: scripts/test-secret-readers.sh
      # The Swarm stack (docs/deploy-swarm.md): compose.swarm.yaml rendered over
      # the Compose files with dummy values and accepted by `docker stack config`
      # (which needs no Swarm). The script's unit tests run in feature-smoke.
      - name: Install Node.js (the script has no dependencies)
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          install: false
      - name: The stack file renders and is valid
        env:
          APP_DOMAIN: app.example.test
          ACME_EMAIL: ops@example.test
          APP_IMAGE: ghcr.io/example/app:0000000000000000000000000000000000000000
          GOTENBERG_IMAGE: ghcr.io/example/app/gotenberg:0000000000000000000000000000000000000000
          CADDY_IMAGE: ghcr.io/example/app/caddy:1
          BACKUP_IMAGE: ghcr.io/example/app/backup:1
          POSTGRES_PASSWORD: ci
          POSTGRES_APP_PASSWORD: ci
          POSTGRES_MAINTENANCE_PASSWORD: ci
          CLOUDFLARE_API_TOKEN: ci
        run: node tools/deploy/swarm.mjs check --stack ci

  # A Knip-only pull request needs lint/Knip validation, but does not
  # need PostgreSQL, application builds or a generator-smoke runner.
  # Mixed app+tooling changes run the full check below (which includes lint).
  tooling-lint:
    needs: changes
    # Generator smoke already installs dependencies and can run lint there.
    # This separate runner is only needed when Knip changed without tools.
    if: >-
      needs.changes.outputs.lint == 'true' && needs.changes.outputs.app != 'true' && needs.changes.outputs.tools != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Lint the workspace and check unused dependencies
        run: pnpm lint

  # Lint, build, the typed client, migrations and the unit tests that take a
  # minute or two (the API's and the packages'), then the quick checks of the
  # same installed workspace: the OpenAPI diff, the web app's bundle budget
  # and Storybook. The web app's unit tests (the unit-web job) and the e2e
  # tests (the e2e jobs) run beside it, not after it.
  check:
    needs: changes
    # Tooling-only edits already get lint and relevant generator smoke checks.
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # PostgreSQL: the migrations applied as a deploy does.
      postgres:
        image: ${{ needs.changes.outputs.postgres }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
          POSTGRES_INITDB_ARGS: --nosync
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      # The full history: Turborepo's affected filter and, on a pull request
      # (its merge commit), the OpenAPI diff against HEAD^1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      # Oxlint in every package, the translation parity check, then knip:
      # unused files, exports and dependencies (knip.jsonc).
      - run: pnpm turbo run lint ${{ needs.changes.outputs.affected == 'true' && '--filter=...[origin/main]' || '' }} && pnpm i18n:check && pnpm knip
      - run: pnpm turbo run build ${{ needs.changes.outputs.affected == 'true' && '--filter=...[origin/main]' || '' }}
      # The typed client's OpenAPI document and types must match the routes.
      - run: pnpm client:check
        if: needs.changes.outputs.api == 'true'
      - name: Migrations match the schema
        if: needs.changes.outputs.api == 'true'
        run: pnpm db:check
      # The owner (CI's superuser, as the Compose stack's) migrates, then
      # creates the app role from DATABASE_URL and checks it: no superuser, no
      # RLS bypass, owns nothing, can use every table. Twice: the second run
      # must find nothing to do. The e2e jobs prove the same from an owner
      # that is no superuser (test/global-setup.ts) and run every test as the
      # app role.
      - name: Migrations apply to PostgreSQL and the app role is made (as `node dist/migrate` does on deploy)
        if: needs.changes.outputs.api == 'true'
        run: pnpm migrate && pnpm migrate
        env:
          DATABASE_OWNER_URL: postgres://app:app@localhost:5432/app
          DATABASE_URL: postgres://app_runtime:app_runtime@localhost:5432/app
      # The unit tests with coverage and the thresholds in each package's
      # vitest.config.ts (`test:cov`: one run). The web app's, the longest
      # (jsdom), have a job of their own: unit-web.
      - name: The API's unit tests (coverage and its thresholds)
        if: needs.changes.outputs.api == 'true'
        run: pnpm turbo run test:cov --filter=@nestjs-monorepo-template/api
      - name: The packages' unit tests (the typed client, the components)
        if: needs.changes.outputs.web == 'true'
        run: pnpm turbo run test:cov --filter='!@nestjs-monorepo-template/api' --filter='!@nestjs-monorepo-template/web'
      - name: Breaking changes in the OpenAPI document
        if: github.event_name == 'pull_request' && needs.changes.outputs.api == 'true'
        env:
          # '' reports only; ERR fails on breaking changes, WARN also on warnings.
          OASDIFF_FAIL_ON: ''
          # oasdiff's own release (github.com/oasdiff/oasdiff), tag and digest:
          # Dependabot doesn't raise it.
          OASDIFF_IMAGE: tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c
        run: |
          set -o pipefail
          spec=packages/api-client/openapi.json
          dir="$RUNNER_TEMP/oasdiff"
          mkdir -p "$dir/$(dirname "$spec")"
          summary() { cat >> "$GITHUB_STEP_SUMMARY"; }
          # The summary takes 1 MiB per step: a longer report is left out.
          section() {
            if [ "$(wc -c < "$2")" -gt 400000 ]; then
              printf '%s: too long for the summary.\n\n' "$1" | summary
            else
              { printf '<details><summary>%s</summary>\n\n' "$1"; sed '/^# API Changelog/d' "$2" | cat -s; printf '\n</details>\n\n'; } | summary
            fi
          }
          printf '## OpenAPI changes\n\n' | summary
          if [ -z "$(git rev-parse --verify --quiet HEAD^2)" ]; then
            echo '::error::HEAD is not a merge commit: the job expects the one a pull request checks out'
            exit 1
          fi
          base=$(git rev-parse HEAD^1)
          if [ -z "$(git ls-tree --name-only "$base" -- "$spec")" ]; then
            echo "No \`$spec\` on the base branch: nothing to compare." | summary
            exit 0
          fi
          if [ ! -f "$spec" ]; then
            echo "::warning file=$spec::The pull request removes the OpenAPI document"
            echo "The pull request removes \`$spec\`." | summary
            [ -z "$OASDIFF_FAIL_ON" ] || exit 1
            exit 0
          fi
          if git diff --quiet "$base" HEAD -- "$spec"; then
            echo "\`$spec\` is unchanged." | summary
            exit 0
          fi
          git show "$base:$spec" > "$dir/base.json"
          # The revision keeps its path, so annotations name the real file.
          cp "$spec" "$dir/$spec"
          # Only the two documents are mounted (no .oasdiff.* config), with no
          # network, and external $refs are refused: the document is untrusted.
          oasdiff() {
            docker run --rm --network none -v "$dir:/specs:ro" -w /specs "$OASDIFF_IMAGE" \
              "$1" base.json "$spec" --allow-external-refs=false "${@:2}"
          }
          # The reports hold the pull request's text (paths, names): they go to
          # files and the summary, never to the log, where a line starting
          # with :: would run as a workflow command. An error message from
          # oasdiff can quote the document too, so commands are off meanwhile.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          oasdiff breaking --format json > "$dir/breaking.json"
          oasdiff breaking --format markdown > "$dir/breaking.md"
          oasdiff changelog --format markdown > "$dir/changelog.md"
          echo "::$token::"
          errors=$(jq '[.[] | select(.level == 3)] | length' "$dir/breaking.json")
          warnings=$(jq '[.[] | select(.level == 2)] | length' "$dir/breaking.json")
          if [ "$errors" -eq 0 ] && [ "$warnings" -eq 0 ]; then
            printf 'No breaking changes.\n\n' | summary
          else
            mode=${OASDIFF_FAIL_ON:+blocking at $OASDIFF_FAIL_ON}
            printf '**Breaking changes: %s errors, %s warnings** (%s).\n\n' \
              "$errors" "$warnings" "${mode:-report-only}" | summary
            section 'Breaking changes' "$dir/breaking.md"
            echo "::warning file=$spec,title=OpenAPI breaking changes::$errors errors, $warnings warnings (see the job summary)"
          fi
          section 'Full changelog' "$dir/changelog.md"
          # Blocking: oasdiff's annotations (it escapes the text) and its exit
          # code. A removal is reported against the base document: same file.
          if [ -n "$OASDIFF_FAIL_ON" ]; then
            oasdiff breaking --format githubactions --fail-on "$OASDIFF_FAIL_ON" |
              sed "s|,file=base\.json::|,file=$spec::|"
          fi
      # The web app's bundle budget (size-limit; fails over its limits) on the
      # build above, and Storybook for packages/ui, published as an artifact.
      - name: Bundle budget
        id: size
        if: needs.changes.outputs.web == 'true'
        run: pnpm turbo run size --filter=@nestjs-monorepo-template/web
      - name: Sizes in the job summary
        if: ${{ !cancelled() && (steps.size.outcome == 'success' || steps.size.outcome == 'failure') }}
        working-directory: apps/web
        run: |
          {
            echo '### Bundle size (brotli) against the budget'
            echo
            echo '| Entry | Size | Limit | |'
            echo '| --- | --- | --- | --- |'
            pnpm exec size-limit --json | jq -r '.[] | "| \(.name) | \(.size) B | \(.sizeLimit) B | \(if .passed then "ok" else "over" end) |"'
            echo
            echo '### Largest JavaScript chunks'
            echo
            echo '| Chunk | Raw | gzip | brotli |'
            echo '| --- | ---: | ---: | ---: |'
            jq -r '.chunks[:10][] | "| \(.file) | \(.bytes) B | \(.gzipBytes) B | \(.brotliBytes) B |"' .bundle-analysis/bundle.json
            echo
            echo '### Largest modules in the biggest chunk'
            echo
            echo '| Module | Rendered |'
            echo '| --- | ---: |'
            jq -r '.chunks[0].modules[:15][] | "| `\(.id)` | \(.renderedBytes) B |"' .bundle-analysis/bundle.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bundle analysis
        if: ${{ !cancelled() && (steps.size.outcome == 'success' || steps.size.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle-analysis
          path: apps/web/.bundle-analysis/bundle.json
          include-hidden-files: true
          retention-days: 14
      - name: Storybook
        if: needs.changes.outputs.web == 'true'
        run: pnpm turbo run build-storybook --filter=@nestjs-monorepo-template/ui
      - name: Storybook (artifact)
        if: needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: packages/ui/storybook-static/
          retention-days: 14
      # The release notes' generator (tools/release/, docs/releases.md): git only.
      - name: The release notes' tests
        run: node --test tools/release/notes.test.mjs
      # The translation parity check's tests (tools/i18n/); the check itself
      # runs in `pnpm lint`.
      - name: The i18n check's tests
        run: node --test tools/i18n/check.test.mjs
      # Guards on this workflow (tools/ci/): its artifact uploads and which
      # jobs a pull request's paths run.
      - name: The workflow's tests
        run: node --test 'tools/ci/*.test.mjs'
      # The env templates (tools/setup/envcheck.mjs): no variable set twice,
      # the REQUIRED ones named. The wizard's tests run in feature-smoke.
      - name: The env templates
        run: pnpm env:check --templates
      # A new project's first step (`pnpm feature:remove notes`) must leave no
      # reference to the example behind: seconds here, where the nightly
      # template-without-notes run found them a day late. Last: it deletes
      # files of this throwaway checkout.
      - name: Nothing of notes is left after `pnpm feature:remove notes`
        run: |
          pnpm feature:remove notes
          if grep -rn --include='*.ts' --include='*.tsx' -e 'features/notes' -e "'/v1/notes" apps/api/src apps/api/test apps/web/src; then
            echo "::error::Still referenced after pnpm feature:remove notes (template-without-notes fails on it)"
            exit 1
          fi

  # The web app's unit tests (jsdom: the longest unit run, ~4 min), with
  # coverage and its thresholds (vitest.config.ts), on a runner of their own
  # so they run beside check rather than after it. Whole, not sharded: shards
  # cost a third more runner-minutes for no shorter run (docs/ci-runtime.md).
  # Turborepo builds what they depend on, replayed from its cache.
  unit-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: unit (web)
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Coverage and its thresholds
        run: pnpm turbo run test:cov --filter=@nestjs-monorepo-template/web

  # The e2e tests in two shards, each on its own runner with its own Redis
  # and PostgreSQL: the slowest step of CI. Vitest's --shard, split by file
  # size (apps/api/test/size-sequencer.ts). They run the sources (no build
  # needed). Raise the list and --shard's total together. A sixth of the
  # suite runs again with the instrumentation on, in e2e-web.
  e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.services == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (${{ matrix.shard }}/2)
    services:
      # Redis: queues, rate limits, realtime; each file keeps to its own prefix.
      redis:
        image: ${{ needs.changes.outputs.redis }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # PostgreSQL: the tests' databases. max_connections is the default 100:
      # raise it before the e2e maxWorkers or the test pool size (docs/pitfalls.md).
      postgres:
        image: ${{ needs.changes.outputs.postgres }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
          POSTGRES_INITDB_ARGS: --nosync
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        env:
          REDIS_URL: redis://localhost:6379
          # The tests create their databases here (a template, then a copy per app).
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/postgres

  # The browser tests (apps/web-e2e, docs/development.md, "Browser tests"):
  # Playwright drives the built web app on the built API with the demo data,
  # on one origin (`vite preview` proxies /v1 as Caddy does), against this
  # job's PostgreSQL and Redis. Apart from the API's e2e shards: a browser
  # to install, and a different failure to read (the HTML report and traces
  # are uploaded when it fails). Accessibility findings (axe) go to the job
  # summary; serious and critical ones fail the tests. Then, on the same
  # build and services: the instrumentation (below). The Data Explorer's spec
  # (test/analytics.spec.ts) is one of the browser tests, in Chrome, under the
  # production Content-Security-Policy; Firefox and WebKit run it in web.yml.
  #
  # The instrumentation: a sixth of the e2e suite with OpenTelemetry
  # (OTEL_EXPORTER_OTLP_ENDPOINT) and Sentry (SENTRY_DSN) pointing at a stub
  # collector on loopback (apps/api/test/telemetry-stub.mjs). test/setup-env.ts
  # starts the SDKs when either is set, as main.ts does, so http, Express, pg
  # and ioredis are patched while the tests run: the instrumentation must not
  # break the app (as NestJS Observe's proxies broke the mail transports and
  # the lock-decorated jobs, issue #392), and the collector must have received
  # the spans of requests the app served (docs/deployment.md, "Telemetry").
  # A sixth, not more: on half the suite it cost ~100 s of an e2e shard (#681).
  # Then the built app started as production starts it. Hosted vendors need
  # credentials CI doesn't have, so NestJS Observe's own path is covered by
  # observe.spec.ts.
  e2e-web:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.services == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: ${{ needs.changes.outputs.redis }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: ${{ needs.changes.outputs.postgres }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
          POSTGRES_INITDB_ARGS: --nosync
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The database and Redis above (apps/web-e2e/scripts/api.mjs reads them).
      DATABASE_URL: postgres://app_runtime:app_runtime@localhost:5432/app
      DATABASE_OWNER_URL: postgres://app:app@localhost:5432/app
      DATABASE_MAINTENANCE_URL: postgres://app_maintenance:app_maintenance@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      # The browser tests run in the runner's Chrome.
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      # The runner's own Google Chrome (E2E_BROWSER_CHANNEL, below), not
      # Playwright's Chromium: no download and no apt, whose mirror took 6-8
      # minutes in 3 of 97 runs (docs/ci-runtime.md). Its version is the
      # runner image's, named here for the log.
      - name: The browser (the runner's Google Chrome)
        run: |
          google-chrome --version
          echo "Chrome: $(google-chrome --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "Playwright: $(pnpm --filter @nestjs-monorepo-template/web-e2e exec playwright --version)" >> "$GITHUB_STEP_SUMMARY"
      # The seed runs only on a database marked as a development one
      # (docs/development.md, "Demo data"): what the development services do
      # when they create theirs (dev/postgres/10-dev-database.sql).
      - name: Mark the database as a development one
        run: PGPASSWORD=app psql -h localhost -U app -d app -c "alter database app set app.dev_database = 'on'"
      - name: The browser tests
        run: pnpm test:e2e:web
        env:
          CI: 'true'
      - name: The stub collector (OTLP/HTTP and Sentry's envelope endpoint)
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.services == 'true'
        run: |
          nohup node apps/api/test/telemetry-stub.mjs serve 4318 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -fs http://127.0.0.1:4318/stats && break
            sleep 0.5
          done
      - name: A sixth of the e2e tests with OpenTelemetry and Sentry on
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.services == 'true'
        run: pnpm test:e2e --shard=1/6
        env:
          # Its own databases on this server (a template, then a copy per app).
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/postgres
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
          # Spans leave the process every second, not every five.
          OTEL_BSP_SCHEDULE_DELAY: '1000'
          SENTRY_DSN: http://public@127.0.0.1:4318/1
      - name: The collector received the spans of requests served
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.services == 'true'
        run: node apps/api/test/telemetry-stub.mjs check 4318
      # The start-up order, which the suite (it starts the SDKs itself) cannot
      # show: the built API (the browser tests built it), with the credentials
      # as `_FILE` secrets and its own collector, on this job's services.
      - name: The built app, started as production starts it, is traced
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.services == 'true'
        run: node apps/api/test/telemetry-stub.mjs boot
      - name: Accessibility findings in the job summary
        if: ${{ !cancelled() }}
        run: node apps/web-e2e/scripts/axe-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      # A failed attempt keeps its trace (retain-on-failure), a retried one
      # included: a flaky test leaves its evidence too, not only a failure.
      - name: The HTML report and traces
        if: ${{ !cancelled() && (failure() || hashFiles('apps/web-e2e/test-results/**/trace.zip') != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web-e2e/playwright-report/
            apps/web-e2e/test-results/
          retention-days: 14

  # The feature generator (tools/feature, `pnpm feature:add`): its tests, then
  # two features generated with every field type and option, which must
  # build, lint, migrate and pass their own generated e2e tests on today's
  # core. Nothing generated is committed: the checkout is thrown away. On a
  # pull request, for the API and tools/ (the generator writes into the API
  # only; the web app's build and lint are check's).
  feature-smoke:
    needs: changes
    if: >-
      needs.changes.outputs.generator == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.services == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: ${{ needs.changes.outputs.redis }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: ${{ needs.changes.outputs.postgres }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      # Reuse this already-installed workspace for tooling-only lint, avoiding
      # a second GitHub runner (and do it before generators modify the tree).
      - name: Lint tooling and unused dependencies
        if: needs.changes.outputs.lint == 'true' && needs.changes.outputs.app != 'true'
        run: pnpm lint
      # The full app check usually runs these guards. Keep them when only
      # scripts change, so moving lint to this job does not lose coverage.
      - name: Release, i18n and environment tooling invariants
        if: needs.changes.outputs.lint == 'true' && needs.changes.outputs.app != 'true'
        run: |
          node --test tools/release/notes.test.mjs tools/i18n/check.test.mjs
          pnpm env:check --templates
      - name: The generator's tests
        run: node --test 'tools/feature/*.test.mjs'
      - name: The setup wizard's tests (tools/setup, `pnpm setup`)
        run: node --test 'tools/setup/*.test.mjs'
      - name: The deploy scripts' tests (tools/deploy, `pnpm deploy:*`)
        run: node --test 'tools/deploy/*.test.mjs'
      - name: 'Generate three features (every field type and capability; a team, a reference, no recycle bin, an approval and settings; API keys and an optional Idempotency-Key, no seed-role grants, no Idempotency-Key)'
        run: |
          pnpm feature:add smoke-widgets --team --client-access own --idempotency optional --description "Generated by CI" \
            --with tags,comments,attachments,revisions,pdf,bulk,watch,search,transfer,custom,events,numbered \
            --fields "title:string,notes:text?,quantity:int,rate:decimal?,total:money,discount:money?,paid:bool,dueOn:date?,sentAt:datetime?,status:enum(draft|sent|paid),meta:json?,code:string!unique,rank:int?"
          pnpm feature:add smoke-parts --no-soft-delete --grants none --with bulk,transfer,watch,comments,events \
            --approvals archive --settings "pageSize:int=25,beta:flag,tone:enum(formal|casual)=formal" \
            --fields "name:string,widgetId:ref(smoke-widgets)?"
          pnpm feature:add smoke-entries --no-soft-delete --idempotency off --fields "title:string,total:money"
      - name: 'Their migration (new tables only: drizzle-kit asks nothing)'
        run: pnpm db:generate
      - name: 'Change a feature by its declaration only: capabilities, fields, an approval, a setting, the recycle bin and teams turned on, then sync'
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('apps/api/src/features/smoke-entries/smoke-entry.record.ts')
          s = p.read_text()
          s = s.replace("    title: field.string(),", "    title: field.string().searchable(),\n    rank: field.int().default(1),\n    note: field.text().optional(),")
          s = s.replace("  capabilities: [],", "  capabilities: ['tags', 'comments', 'attachments', 'revisions', 'pdf', 'bulk', 'watch', 'search', 'transfer', 'custom', 'events', 'numbered'],")
          # An approval and a setting, by the declaration only: sync writes the effects file and wires the module.
          assert "  fields: {" in s
          s = s.replace("  fields: {", "  approvals: {\n    markDone: { label: 'Mark an entry done' },\n  },\n  settings: {\n    pageSize: recordSetting.int(25),\n  },\n  fields: {", 1)
          s = s.replace("import { defineRecord } from '../../platform/records/record.js';", "import { defineRecord } from '../../platform/records/record.js';\nimport { recordSetting } from '../../platform/records/record-settings.js';", 1)
          for flag in ('softDelete', 'team'):
              assert f"  {flag}: false," in s, flag
              s = s.replace(f"  {flag}: false,", f"  {flag}: true,")
          p.write_text(s)
          PY
          pnpm feature:sync
          pnpm feature:sync --check
          pnpm db:generate
      # Without knip: it checks this repository's own code (knip.jsonc), not a
      # generated one.
      - run: pnpm lint:code
      - run: pnpm build
      - run: pnpm db:check
      - run: pnpm turbo run client:generate
      - name: Their generated e2e tests, and the OpenAPI document's paths
        run: pnpm --filter @nestjs-monorepo-template/api exec vitest run --config ./vitest.config.e2e.ts test/smoke-widgets.e2e-spec.ts test/smoke-parts.e2e-spec.ts test/smoke-entries.e2e-spec.ts test/openapi.e2e-spec.ts
        env:
          REDIS_URL: redis://localhost:6379
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/postgres

  # A new project's first step: the example feature removed
  # (`pnpm feature:remove notes`), the template must still build, lint,
  # migrate and pass every remaining test, unit and e2e (the platform's run
  # on the test-only record, test/fixtures). Thrown away like feature-smoke's.
  template-without-notes:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tags, the nightly and manual runs, and any change that validates
    # everything (`full`): in six shards, so it lasts as long as a pull
    # request's run; each shard repeats the cheap steps, then
    # runs its sixth of the e2e suite and a sixth of the unit tests (shards
    # 1-3 the API's third, 4-6 the web app's). A pull request runs only the
    # leftover check (`check`, last step): the suites are the e2e and unit
    # jobs' with a feature fewer. Raise the list and the totals together.
    strategy:
      fail-fast: false
      # Reserve runner capacity for other pull requests.
      max-parallel: 2
      matrix:
        # Matrix expressions: the job-level `if` can't read the matrix.
        shard: [1, 2, 3, 4, 5, 6]
    name: template-without-notes (${{ matrix.shard }}/6)
    services:
      redis:
        image: ${{ needs.changes.outputs.redis }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: ${{ needs.changes.outputs.postgres }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
      - name: Turborepo cache (GitHub Actions cache service)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Remove the example feature
        run: pnpm feature:remove notes
      - name: 'Its table dropped (a generated migration: drizzle-kit asks nothing)'
        run: pnpm db:generate
      - name: Nothing of notes is left outside docs and generated files
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -e 'features/notes' -e "'/v1/notes" apps/api/src apps/api/test apps/web/src; then
            echo "Still referenced after pnpm feature:remove notes" >&2
            exit 1
          fi
      - name: 'Lint (once: shard 1)'
        if: matrix.shard == 1
        run: pnpm lint:code
      - run: pnpm build
      - run: pnpm db:check
      - run: pnpm turbo run client:generate
      # The web app types its calls with the client: built again on the one
      # without notes (Turborepo rebuilds the client and the web app only).
      - name: 'Build on the regenerated client (once: shard 1)'
        if: matrix.shard == 1
        run: pnpm build
      # The unit jobs' split (3 API shards, 3 web shards), over this job's six;
      # the small packages' tests ride on shard 1.
      - name: Unit and web tests (a share per shard; not on pull requests)
        if: needs.changes.outputs.full == 'true'
        run: |
          shard=${{ matrix.shard }}
          if [ "$shard" -le 3 ]; then
            pnpm turbo run test --filter=@nestjs-monorepo-template/api -- --shard="$shard/3"
          else
            pnpm turbo run test --filter=@nestjs-monorepo-template/web -- --shard="$((shard - 3))/3"
          fi
          if [ "$shard" -eq 1 ]; then
            pnpm turbo run test --filter='!@nestjs-monorepo-template/api' --filter='!@nestjs-monorepo-template/web'
          fi
      - name: Every e2e test (this shard's sixth; not on pull requests)
        if: needs.changes.outputs.full == 'true'
        run: pnpm --filter @nestjs-monorepo-template/api exec vitest run --config ./vitest.config.e2e.ts --shard=${{ matrix.shard }}/6
        env:
          REDIS_URL: redis://localhost:6379
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/postgres

  # Fails on: a high or critical advisory in a production dependency, any
  # secret in the repository, a high or critical misconfiguration in a
  # Dockerfile. GitHub code scanning (CodeQL, SARIF) isn't available to a
  # private repository on the free plan, so the results are the job's log.
  security:
    needs: changes
    # Scan runtime/deploy changes and executable tooling, not Knip-only edits.
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm (the audit reads the lockfile only)
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          install: false
      - name: No high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # Trivy's own release (github.com/aquasecurity/trivy): Dependabot doesn't raise it.
          version: v0.76.0
          cache: true
      - name: No secrets in the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy
      - name: No high or critical misconfigurations (Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy

  # The production image builds and has no fixable high or critical
  # vulnerability (OS packages and node_modules); then, for API and stack
  # changes, the production stack runs on it under its hardening, on the same
  # runner (no artifact to hand over). The image goes to the publish job only
  # when this run publishes.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # loadtest/run.sh's names only: its `down` removes the project's volumes.
      LOADTEST_PROJECT: loadtest-hardened
      LOADTEST_GHA_CACHE: '1'
      # run.sh's default; ignored by git.
      LOADTEST_OUT: loadtest/results
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away: removing the builder took 30-90 s.
          cleanup: false
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The repository root: the image takes the workspace (lockfile, packages/).
          context: .
          file: apps/api/Dockerfile
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          tags: app:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          # Written by main and the nightly run, read by every pull request: a
          # pull request's own cache serves only its later pushes, and writing
          # it cost ~40 s a run.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - name: No fixable high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy

      # Returns once the API answers behind Caddy; otherwise prints the logs
      # and fails.
      - name: Start the stack
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.stack == 'true'
        env:
          APP_IMAGE: app:ci
        run: loadtest/run.sh up
      # `docker compose up --build` invokes Buildx directly, so expose the
      # GitHub cache runtime URL and token for the `type=gha` build cache.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.stack == 'true'
      - name: Every container runs, healthy and never restarted
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.stack == 'true'
        run: |
          # The files and the environment run.sh starts the stack with.
          compose() {
            API_REPLICAS=2 LOADTEST_CAPTCHA=off docker compose \
              --project-name "$LOADTEST_PROJECT" --env-file "$LOADTEST_OUT/stack.env" \
              -f compose.yaml -f compose.prod.yaml -f compose.loadtest.yaml -f compose.ci-cache.yaml \
              --profile backup "$@"
          }
          # The backup service writes /backups as `postgres`: its first run
          # (the scheduler takes one at once on an empty volume) proves it can.
          # Built from backup/ (its own cache scope, compose.ci-cache.yaml);
          # backup-image verifies the image itself when backup/ changes.
          compose up -d --build --no-deps backup
          for _ in $(seq 1 45); do
            compose exec -T backup test -s /backups/.last-success && break
            sleep 2
          done
          compose exec -T backup test -s /backups/.last-success || { echo "::error::the backup service made no backup"; exit 1; }
          # Redis writes /data as root: a save must work (MISCONF otherwise).
          compose exec -T redis sh -c 'export REDISCLI_AUTH="$REDIS_PASSWORD"; redis-cli bgsave | grep -q "Background saving"; sleep 3; redis-cli info persistence | tr -d "\r" | grep -qx rdb_last_bgsave_status:ok' \
            || { echo "::error::redis can't save its data"; exit 1; }
          state() {
            for id in $(compose ps -aq); do
              docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}} {{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id"
            done | sort
          }
          # migrate ran once and exited 0; the others run, healthy or without
          # a healthcheck, and none was restarted.
          settled() {
            state | awk '
              { seen[$1] = 1 }
              $1 == "migrate" { if ($2 != "exited" || $3 != "exit=0") bad = 1; next }
              $2 != "running" || $4 != "restarts=0" || ($5 != "health=healthy" && $5 != "health=none") { bad = 1 }
              END {
                n = split("postgres redis migrate api worker caddy backup", want, " ")
                for (i = 1; i <= n; i++) if (!(want[i] in seen)) bad = 1
                exit bad + 0
              }'
          }
          for _ in $(seq 1 30); do
            settled && break
            sleep 2
          done
          state
          settled || { echo "::error::a container exited, was restarted or is unhealthy"; exit 1; }
          # A missing tmpfs or volume is named in the logs.
          if compose logs --no-color 2>&1 | grep -i 'read-only file system'; then
            echo "::error::a container wrote to the read-only filesystem"
            exit 1
          fi
      - name: The containers' logs
        if: failure() && (needs.changes.outputs.api == 'true' || needs.changes.outputs.stack == 'true')
        run: |
          for id in $(docker ps -aq --filter "label=com.docker.compose.project=$LOADTEST_PROJECT"); do
            echo "::group::$(docker inspect -f '{{.Name}} {{.State.Status}} {{.State.Error}}' "$id")"
            docker logs --tail 80 "$id" 2>&1 || true
            echo "::endgroup::"
          done
      - name: Remove the stack and its volumes
        if: always() && (needs.changes.outputs.api == 'true' || needs.changes.outputs.stack == 'true')
        run: loadtest/run.sh down
      - name: Export the verified image
        if: needs.changes.outputs.publish == 'true'
        run: |
          docker save app:ci -o "${{ runner.temp }}/app.tar"
          (cd "${{ runner.temp }}" && sha256sum app.tar > app.tar.sha256)
          docker image inspect --format '{{.Id}}' app:ci > "${{ runner.temp }}/app.id"
      - name: Transfer the verified image
        if: needs.changes.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-app
          path: |
            ${{ runner.temp }}/app.tar
            ${{ runner.temp }}/app.tar.sha256
            ${{ runner.temp }}/app.id
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  # The backup service's image (backup/) builds, works and passes the same
  # scan. Its own cache scope, so it never evicts the app image's. Not
  # published: every deploy builds it (`docker compose up -d --build`).
  backup-image:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away: removing the builder took 30-90 s.
          cleanup: false
      - name: Build the backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backup
          load: true
          tags: backup:ci
          cache-from: type=gha,scope=backup
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=backup,mode=max' || '' }}
      # Encryption (age) and point-in-time recovery, end to end in the image,
      # on a throwaway PostgreSQL (backup/test-pitr.sh).
      - name: Encryption and point-in-time recovery work
        run: scripts/test-backup-pitr.sh backup:ci
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - name: No fixable high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: backup:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy

  # Caddy's image (caddy/Dockerfile, built from the repository root as
  # compose.prod.yaml does; caddy/Dockerfile.dockerignore picks what goes
  # in): the web app's production build (apps/web), the xcaddy build with
  # the Cloudflare DNS plugin, then the same scan. Its own cache scope.
  # Published by publish-caddy, as the app image is.
  caddy-image:
    needs: changes
    if: needs.changes.outputs.caddy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away: removing the builder took 30-90 s.
          cleanup: false
      - name: Build the Caddy image (with the web app)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: caddy/Dockerfile
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          tags: caddy:ci
          cache-from: type=gha,scope=caddy
          # Main and the nightly run write it, pull requests only read it: the
          # export took ~110 s of a 211 s build (the install layer, 389 MB).
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=caddy,mode=max' || '' }}
      - name: Non-root runtime, HTTPS, restarts and certificate-volume migration
        run: caddy/test-runtime.sh caddy:ci
      - name: The web app is in the image
        run: docker run --rm --entrypoint test caddy:ci -f /srv/web/index.html
      - name: Built web manifest identifies this exact source commit
        run: |
          docker run --rm --entrypoint cat caddy:ci /srv/web/version.json |
            jq -e --arg sha "$GITHUB_SHA" '.sha == $sha'
      - name: The maintenance page is in the image
        run: docker run --rm --entrypoint test caddy:ci -f /srv/maintenance/index.html
      # The Caddyfile parses (its security.txt handle included), and the entrypoint
      # writes the file from SECURITY_CONTACT, and writes none without it (docs/deployment.md).
      # Caddy's Cloudflare module checks the token's format while it provisions the
      # ACME DNS provider (legacy: 35-50 alphanumeric, dash or underscore), so the dummy must look like one.
      - name: The Caddyfile is valid
        run: |
          docker run --rm -e APP_DOMAIN=ci.example.com -e ACME_EMAIL=ci@example.com \
            -e CLOUDFLARE_API_TOKEN=0123456789abcdef0123456789abcdef01234567 \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: security.txt is written from SECURITY_CONTACT
        run: |
          docker run --rm -e CLOUDFLARE_API_TOKEN=ci -e SECURITY_CONTACT=mailto:ci@example.com \
            caddy:ci test -f /tmp/caddy-security/.well-known/security.txt
          docker run --rm -e CLOUDFLARE_API_TOKEN=ci caddy:ci \
            sh -c 'test ! -f /tmp/caddy-security/.well-known/security.txt'
      # The Caddyfile's behaviour, run by the image's own Caddy: the app, and
      # with MAINTENANCE_PAGE=on the static page (503) for the web app's paths
      # and the API's paths untouched (caddy/caddyfile.test.mjs, which edits out
      # the TLS block and the Docker names, and fails if an edit finds nothing).
      - name: The Caddyfile serves the app, and the maintenance page when asked
        run: |
          docker create --name caddy-bin caddy:ci
          docker cp caddy-bin:/usr/bin/caddy "$RUNNER_TEMP/caddy"
          docker rm caddy-bin
          CADDY_BIN="$RUNNER_TEMP/caddy" node --test caddy/caddyfile.test.mjs
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - name: No fixable high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: caddy:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy

      - name: Export the verified image
        if: needs.changes.outputs.publish == 'true'
        run: |
          docker save caddy:ci -o "${{ runner.temp }}/caddy.tar"
          (cd "${{ runner.temp }}" && sha256sum caddy.tar > caddy.tar.sha256)
          docker image inspect --format '{{.Id}}' caddy:ci > "${{ runner.temp }}/caddy.id"
      - name: Transfer the verified image
        if: needs.changes.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-caddy
          path: |
            ${{ runner.temp }}/caddy.tar
            ${{ runner.temp }}/caddy.tar.sha256
            ${{ runner.temp }}/caddy.id
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  # Gotenberg's image (gotenberg/: the official one, pinned, made thin on
  # top of), which renders the PDF documents: its pins agree with each other
  # and with compose.dev.yaml, then it builds (its Debian upgrade fresh each
  # run that can publish) and passes the same scan. Its own cache scope.
  # Published by publish-gotenberg, as the app image is.
  gotenberg-image:
    needs: changes
    if: needs.changes.outputs.gotenberg == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: One Gotenberg release everywhere, with the same flags
        run: |
          # The FROM line (Dependabot raises it) and the release the Go programs are built from.
          base=$(grep -oE '^FROM gotenberg/gotenberg:[^ ]+' gotenberg/Dockerfile | cut -d' ' -f2)
          source=$(grep -oE '^ARG GOTENBERG_VERSION=v[0-9.]+' gotenberg/Dockerfile | cut -d= -f2)
          dev=$(yq '.services.gotenberg.image' compose.dev.yaml)
          echo "base: $base, source: $source, development: $dev"
          case "$base" in
            "gotenberg/gotenberg:${source#v}-chromium@sha256:"*) ;;
            *) echo "::error file=gotenberg/Dockerfile::FROM $base is not GOTENBERG_VERSION $source's Chromium image, pinned by digest"; exit 1 ;;
          esac
          if [ "$dev" != "$base" ]; then
            echo "::error file=compose.dev.yaml::services.gotenberg.image is $dev, gotenberg/Dockerfile builds on $base"
            exit 1
          fi
          if [ "$(yq -o json '.services.gotenberg.command' compose.prod.yaml)" != "$(yq -o json '.services.gotenberg.command' compose.dev.yaml)" ]; then
            echo "::error file=compose.dev.yaml::services.gotenberg.command differs from compose.prod.yaml's"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away: removing the builder took 30-90 s.
          cleanup: false
      - name: The day (a pull request's Debian upgrade)
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build the Gotenberg image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gotenberg
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          tags: gotenberg:ci
          # A new value per workflow run: the Debian upgrade runs again (the
          # cache would keep the first one's packages for ever), and the
          # publish job of the same run reuses this very build. A pull request
          # publishes nothing: its value is the day's, so its later pushes
          # reuse that upgrade (3-7 min) from its own cache.
          build-args: APT_REFRESH=${{ github.event_name == 'pull_request' && format('pr-{0}', steps.day.outputs.day) || github.run_id }}
          cache-from: type=gha,scope=gotenberg
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=gotenberg,mode=max' || '' }}
      # The unit and e2e tests answer with a stub PDF, never Gotenberg's: only
      # here does the image render for real (its Go programs rebuilt, its
      # Debian packages, Chromium among them, upgraded this very run).
      - name: It renders a PDF that opens
        run: |
          # Production's flags (compose.prod.yaml), the container as it runs there.
          mapfile -t command < <(yq -r '.services.gotenberg.command[]' compose.prod.yaml)
          docker run -d --name gotenberg-smoke -p 127.0.0.1:3100:3000 gotenberg:ci "${command[@]}"
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:3100/health >/dev/null; do sleep 1; done'
          # The request the API's PdfRenderer makes.
          curl -fsS http://127.0.0.1:3100/forms/chromium/convert/html \
            -F 'files=@gotenberg/smoke.html;filename=index.html' \
            -F preferCssPageSize=true -F printBackground=true -F generateTaggedPdf=true \
            -o "$RUNNER_TEMP/smoke.pdf"
          head -c 5 "$RUNNER_TEMP/smoke.pdf" | grep -q '^%PDF-'
          tail -c 1024 "$RUNNER_TEMP/smoke.pdf" | grep -aq '%%EOF'
          # The image's own pdfcpu (the one built here) reads it as a whole: one A4 page.
          docker cp "$RUNNER_TEMP/smoke.pdf" gotenberg-smoke:/tmp/smoke.pdf
          docker exec gotenberg-smoke pdfcpu validate -m relaxed /tmp/smoke.pdf
          docker exec gotenberg-smoke pdfcpu info /tmp/smoke.pdf | grep -E 'Page count: +1$'
      - name: Gotenberg's log, when it did not
        if: failure()
        run: docker logs gotenberg-smoke || true
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - name: No fixable high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: gotenberg:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy
      - name: Export the verified image
        if: needs.changes.outputs.publish == 'true'
        run: |
          docker save gotenberg:ci -o "${{ runner.temp }}/gotenberg.tar"
          (cd "${{ runner.temp }}" && sha256sum gotenberg.tar > gotenberg.tar.sha256)
          docker image inspect --format '{{.Id}}' gotenberg:ci > "${{ runner.temp }}/gotenberg.id"
      - name: Transfer the verified image
        if: needs.changes.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-gotenberg
          path: |
            ${{ runner.temp }}/gotenberg.tar
            ${{ runner.temp }}/gotenberg.tar.sha256
            ${{ runner.temp }}/gotenberg.id
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  ci-gate:
    name: CI gate
    if: always()
    needs:
      [
        changes,
        ci-validate,
        stack-config,
        tooling-lint,
        check,
        unit-web,
        e2e,
        e2e-web,
        feature-smoke,
        template-without-notes,
        security,
        image,
        backup-image,
        caddy-image,
        gotenberg-image,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require the classified checks
        env:
          EXPECTED: ${{ needs.changes.outputs.expected }}
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci/gate.mjs

  publish:
    name: Publish app
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' &&
      needs.changes.outputs.publish == 'true' && needs.changes.outputs.release_ready == 'true' && needs.changes.outputs.api_image == 'true'
    needs: [changes, ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image-app
          path: ${{ runner.temp }}/image
      - name: Load the verified image
        run: |
          (cd "${{ runner.temp }}/image" && sha256sum -c app.tar.sha256)
          docker load -i "${{ runner.temp }}/image/app.tar"
          test "$(docker image inspect --format '{{.Id}}' app:ci)" = "$(cat "${{ runner.temp }}/image/app.id")"
      - name: Tags for the verified image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push without rebuilding
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag app:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          # Resolve the immutable SHA tag just pushed; never a mutable branch tag.
          ref="${REPOSITORY,,}:$GITHUB_SHA"
          digest=$(docker inspect --format '{{json .RepoDigests}}' "$ref" | jq -er --arg repo "${REPOSITORY,,}@" '.[] | select(startswith($repo)) | split("@")[1]')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=${REPOSITORY,,}@$digest" >> "$GITHUB_OUTPUT"
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - name: No fixable high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.push.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy
      - name: Sign the image, attest its provenance and SBOM
        uses: ./.github/actions/sign-image
        with:
          image: ghcr.io/${{ github.repository }}
          digest: ${{ steps.push.outputs.digest }}

  publish-gotenberg:
    name: Publish gotenberg
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' &&
      needs.changes.outputs.publish == 'true' && needs.changes.outputs.release_ready == 'true' && needs.changes.outputs.gotenberg == 'true'
    needs: [changes, ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
