          (cd "${{ runner.temp }}/image" && sha256sum -c gotenberg.tar.sha256)
          docker load -i "${{ runner.temp }}/image/gotenberg.tar"
          test "$(docker image inspect --format '{{.Id}}' gotenberg:ci)" = "$(cat "${{ runner.temp }}/image/gotenberg.id")"
      - name: Tags for the verified image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/gotenberg
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push without rebuilding
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPOSITORY: ghcr.io/${{ github.repository }}/gotenberg
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag gotenberg:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          # Resolve the immutable SHA tag just pushed; never a mutable branch tag.
          ref="${REPOSITORY,,}:$GITHUB_SHA"
          digest=$(docker inspect --format '{{json .RepoDigests}}' "$ref" | jq -er --arg repo "${REPOSITORY,,}@" '.[] | select(startswith($repo)) | split("@")[1]')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=${REPOSITORY,,}@$digest" >> "$GITHUB_OUTPUT"
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - name: No fixable high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.push.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy
      - name: Sign the image, attest its provenance and SBOM
        uses: ./.github/actions/sign-image
        with:
          image: ghcr.io/${{ github.repository }}/gotenberg
          digest: ${{ steps.push.outputs.digest }}

  publish-caddy:
    name: Publish caddy
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' &&
      needs.changes.outputs.publish == 'true' && needs.changes.outputs.release_ready == 'true' && needs.changes.outputs.caddy == 'true'
    needs: [changes, ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image-caddy
