# Deploys an already tested, scanned and signed release to one of our two
# Docker Swarm environments (docs/deploy-swarm.md, "Environments and CI
# deploys"). Image producers stay in ci.yml: this workflow never builds.
#
#   staging      every CI / CD run on main that published a release manifest,
#                while the repository variable AUTO_DEPLOY is 'true'; or by hand
#                (tag empty: the newest such run)
#   production   only by hand, with a release tag whose GitHub release is
#                published and not a pre-release; the environment's required
#                reviewer approves the run
#
# verify (no environment, no secrets) picks the CI run and checks its evidence
# and every image (tools/ci/deploy-release.mjs); deploy joins the tailnet and
# runs tools/deploy/swarm.mjs against the host's Docker over SSH, with the
# environment's DEPLOY_ENV_FILE and the images pinned by digest. swarm.mjs
# migrates, rolls out and rolls a failed update back by itself; the database is
# never rolled back (migrations are expand/contract).
name: Deploy
run-name: >-
  Deploy ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  ${{ inputs.tag || '' }}

on:
  workflow_run:
    workflows: ['CI / CD']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to deploy'
        type: choice
        options: [staging, production]
        default: staging
      tag:
        description: 'Release tag (v1.2.3). Required for production; empty on staging: the newest main build'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    # After CI only for a successful run of main's own push (or a bootstrap
    # dispatch), and only while AUTO_DEPLOY is on; by hand only from main.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      skip: ${{ steps.release.outputs.skip }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      api: ${{ steps.release.outputs.api }}
      caddy: ${{ steps.release.outputs.caddy }}
      gotenberg: ${{ steps.release.outputs.gotenberg }}
      backup: ${{ steps.release.outputs.backup }}
    steps:
      - name: Target environment
        id: target
        env:
          ENVIRONMENT: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
        run: echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate for immutable image verification
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the selected release and every image
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENVIRONMENT: ${{ steps.target.outputs.environment }}
          DEPLOY_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tools/ci/deploy-release.mjs

  deploy:
    needs: verify
    if: needs.verify.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ needs.verify.outputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ needs.verify.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      APP_URL: ${{ vars.APP_URL }}
      TS_TAG: ${{ vars.TS_TAG }}
    steps:
      - name: Use the deployment files of the verified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - name: Install Node.js (the deploy script has no dependencies)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          install: false
      - name: Require the environment's settings
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo '::error::Set the environment variable DEPLOY_HOST (the host'"'"'s tailnet name).'; exit 1; }
          [[ "$TS_TAG" =~ ^tag:[a-z0-9-]+$ ]] || { echo '::error::Set the environment variable TS_TAG (the tailnet tag of this environment'"'"'s deploys).'; exit 1; }
          [ -n "$DEPLOY_ENV_FILE" ] || { echo '::error::Set the environment secret DEPLOY_ENV_FILE (docs/deploy-swarm.md, "Configuration").'; exit 1; }
      - name: Join the deployment tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          # Each environment's own tag and trust credential: a staging run
          # can't reach the production host (docs/deploy-swarm.md).
          tags: ${{ env.TS_TAG }}
          version: 1.104.2
      - name: Reach the host's Docker over SSH
        run: |
          # Tailscale SSH: the tailnet authenticates the host and allows this
          # environment's tag in as `deploy` (docs/deploy-swarm.md), so the
          # runner, new every time, takes the host key it is shown.
          install -d -m 700 ~/.ssh
          printf 'Host %s\n  User deploy\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 30\n' "$DEPLOY_HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "DOCKER_HOST=ssh://deploy@$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Pull access for the Swarm
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the stack
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          # The environment's overlays: the sizing, and production's tunnel
          # (SWARM_OVERLAYS=compose.small.yaml,compose.tunnel.yaml).
          SWARM_OVERLAYS: ${{ vars.SWARM_OVERLAYS || 'compose.small.yaml' }}
          APP_IMAGE: ${{ needs.verify.outputs.api }}
          CADDY_IMAGE: ${{ needs.verify.outputs.caddy }}
          BACKUP_IMAGE: ${{ needs.verify.outputs.backup }}
          # Only a release from before Gotenberg ran its official image (pinned
          # in compose.prod.yaml since) has one: its stack file still asks.
          GOTENBERG_IMAGE: ${{ needs.verify.outputs.gotenberg }}
        run: |
          for image in "$APP_IMAGE" "$CADDY_IMAGE" "$BACKUP_IMAGE" ${GOTENBERG_IMAGE:+"$GOTENBERG_IMAGE"}; do
            [[ "$image" =~ ^ghcr\.io/[a-z0-9./_-]+@sha256:[a-f0-9]{64}$ ]] || { echo "::error::not a pinned image: $image"; exit 1; }
          done
          umask 077
          printf '%s\n' "$DEPLOY_ENV_FILE" > "$RUNNER_TEMP/deploy.env"
          docker info --format 'Swarm on {{.Name}}: {{.Swarm.LocalNodeState}}'
          node tools/deploy/swarm.mjs deploy --env-file "$RUNNER_TEMP/deploy.env"
      - name: Verify readiness
        if: env.APP_URL != ''
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 \
            "$APP_URL/health" -o "$RUNNER_TEMP/readiness.json"
          jq -e '.status == "ok"' "$RUNNER_TEMP/readiness.json" > /dev/null
          echo "Readiness passed: $APP_URL/health" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the environment file
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.env" ~/.ssh/config
