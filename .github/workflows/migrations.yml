# Pull requests: the expand/contract lint (docs/pitfalls.md, "Migrations:
# expand/contract"; tools/migration-lint/lint.mjs). The migrations a pull
# request adds under apps/api/drizzle/ are read by squawk, and what breaks
# the release before them (drops, renames, retypes, SET NOT NULL, a NOT NULL
# column without a default, dropped defaults and constraints, TRUNCATE,
# DELETE and UPDATE without WHERE) goes to the job summary, with file and
# line, and fail the pull request (MIGRATION_LINT_FAIL: on); a reviewed
# contract step takes the destructive-migration label. A change to a
# migration that was already merged (edited, deleted, its journal entry
# changed or out of order) and a squawk-ignore comment fail either way,
# unless the label accepts them. The label is read when the job runs (a
# re-run sees it as it is now) and counts only when it was added after the
# head commit was pushed: every push needs it again.
#
# Its own workflow, so that adding or removing the label runs this check
# again, not the whole CI.
#
# Every label event starts a run, and a pull request gets several in a
# moment (ci, bug, in progress...) next to the push's own, which the
# concurrency group then cancels. Only the destructive-migration label
# changes the result, so a run for any other label gets its own group (it
# cannot cancel the push's run) and its job is skipped.
name: Migrations

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Only migration-affecting PRs need the SQL lint or its label re-check.
    paths:
      - apps/api/drizzle/**
      - apps/api/drizzle.config.ts
      - tools/migration-lint/**
      - .github/workflows/migrations.yml

permissions:
  contents: read
  # The label: the pull request's events, and the runs of its head commit
  # (when it was pushed).
  pull-requests: read
  actions: read

concurrency:
  group: migrations-${{ github.ref }}${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && github.event.label.name != 'destructive-migration' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  migration-lint:
    if: ${{ !(contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && github.event.label.name != 'destructive-migration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # on fails on destructive statements (a reviewed contract step takes
      # the destructive-migration label); '' would report only.
      MIGRATION_LINT_FAIL: 'on'
    steps:
      # A pull request checks out its merge commit: HEAD^1 is the base
      # branch it was merged onto, so the comparison is this pull request's alone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Install Node.js (the lint has no dependencies)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          install: false
      # squawk's image (pinned in lint.mjs) is pulled here; its containers
      # run without network. The fixtures and the migrations are the pull
      # request's text: workflow commands are off while they are read, and
      # the lint writes them to the summary only, never to the log.
      - name: The lint's tests (every rule on its fixtures)
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          status=0
          node --test tools/migration-lint/lint.test.mjs || status=$?
          echo "::$token::"
          exit "$status"
      - name: Destructive statements in the new migrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$(git rev-parse --verify --quiet HEAD^2)" ]; then
            echo '::error::HEAD is not a merge commit: the job expects the one a pull request checks out'
            exit 1
          fi
          annotations="$RUNNER_TEMP/migration-lint-annotations.txt"
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          status=0
          node tools/migration-lint/lint.mjs --base "$(git rev-parse HEAD^1)" \
            --summary "$GITHUB_STEP_SUMMARY" --annotations "$annotations" \
            --pr "$PR_NUMBER" --head "$HEAD_SHA" || status=$?
          echo "::$token::"
          # The annotations: file, line and the rule's text, escaped by the
          # lint (none of the SQL).
          if [ -f "$annotations" ]; then cat "$annotations"; fi
          exit "$status"
