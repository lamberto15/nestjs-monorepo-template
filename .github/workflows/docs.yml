name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
      - name: Validate source references and local Markdown links
        run: node tools/docs/check.mjs
      - name: Build searchable site
        run: pnpm docs:build
