# Versions from the Conventional Commit titles of the pull requests merged to
# main (docs/releases.md): fix → patch, feat → minor, a breaking change →
# minor while below 1.0. On every push to main, Release Please keeps one open
# "chore(main): release x.y.z" pull request with the next version and its
# CHANGELOG.md entry. Merging it is the decision to release: it tags vX.Y.Z on
# that commit and publishes the GitHub release with the changelog entry.
#
# Only the built-in token: no personal token, no GitHub App. What that token
# creates (the release pull request, the tag) starts no workflow by itself:
# for the release pull request's CI, select "Approve workflows to run" on it,
# or close and reopen it as a person (docs/releases.md).
#
# Config: release-please-config.json; .release-please-manifest.json holds the
# last released version.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release branch, the tag, the release
      pull-requests: write # the release pull request
      issues: write # its "autorelease" labels
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
