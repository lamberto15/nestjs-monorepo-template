# The newest versions as reviewed pull requests, instead of floating tags.
version: 2
updates:
  - package-ecosystem: npm # the whole pnpm workspace (apps/*, packages/*) and its lockfile
    directory: /
    schedule:
      interval: weekly
    # Every dependency is an exact version (pnpm-workspace.yaml saveExact; `pnpm lint`
    # refuses ranges): raise the pinned version itself, never widen it to a range.
    versioning-strategy: increase
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      # vitest and its plugins share one version: one pull request moves them together.
      vitest:
        patterns: ['vitest', '@vitest/*']
    ignore:
      # @types/node follows the Node.js major the app runs on (devEngines.runtime,
      # the Dockerfile's node image, CI's runtime): raise it with them, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7.0 ships the `tsc` executable only: `nest build` and
      # openapi-typescript (the typed client) need its compiler API, due back
      # in 7.1. Remove this once 7.1 is out and they build with it.
      - dependency-name: typescript
        versions: ['7.0.x']
  # apps/api/Dockerfile, caddy/Dockerfile, backup/Dockerfile,
  # gotenberg/Dockerfile and the devcontainer's .devcontainer/Dockerfile. Not
  # seen: backup's SUPERCRONIC_VERSION and RCLONE_TAG build arguments (rclone is
  # built from its release tag, not copied from its image), gotenberg's
  # GOTENBERG_VERSION and PDFCPU_VERSION build arguments, and the
  # golang.org/x versions it builds with (raised by hand; CI's gotenberg-image
  # job fails while GOTENBERG_VERSION isn't the FROM line's release).
  - package-ecosystem: docker
    directories: [/apps/api, /caddy, /backup, /gotenberg, /.devcontainer]
    schedule:
      interval: weekly
    # Node.js is a coordinated platform choice: the runtime image, the
    # build image, package.json engines/devEngines and CI must agree.
    # Keep receiving Node 26 patch updates; migrate to 28 only in a dedicated PR.
    ignore:
      - dependency-name: node
        versions: ['>=27.0.0']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
