# The newest versions as reviewed pull requests, instead of floating tags.
version: 2
updates:
  - package-ecosystem: npm # the whole pnpm workspace (apps/*, packages/*) and its lockfile
    directory: /
    schedule:
      interval: weekly
    # Every dependency is an exact version (pnpm-workspace.yaml saveExact; `pnpm lint`
    # refuses ranges): raise the pinned version itself, never widen it to a range.
    versioning-strategy: increase
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      # vitest and its plugins share one version: one pull request moves them together.
      vitest:
        patterns: ['vitest', '@vitest/*']
      # Each set shares one version: a lone bump leaves them mismatched.
      tiptap:
        patterns: ['@tiptap/*']
      storybook:
        patterns: ['storybook', '@storybook/*']
      size-limit:
        patterns: ['size-limit', '@size-limit/*']
    ignore:
      # @types/node follows the Node.js major the app runs on (devEngines.runtime,
      # the Dockerfile's node image, CI's runtime): raise it with them, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7.0 ships the `tsc` executable only: `nest build` and
      # openapi-typescript (the typed client) need its compiler API, due back
      # in 7.1. Remove this once 7.1 is out and they build with it.
      - dependency-name: typescript
        versions: ['7.0.x']
  # apps/api/Dockerfile, caddy/Dockerfile and backup/Dockerfile. Not seen: backup's SUPERCRONIC_VERSION and RCLONE_TAG build arguments (rclone is
  # built from its release tag, not copied from its image).
  - package-ecosystem: docker
    directories: [/apps/api, /caddy, /backup]
    schedule:
      interval: weekly
    # Node.js is a coordinated platform choice: the runtime image, the
    # build image, package.json engines/devEngines and CI must agree.
    # Keep receiving Node 26 patch updates; migrate to 28 only in a dedicated PR.
    ignore:
      - dependency-name: node
        versions: ['>=27.0.0']
  # The Compose files' images, Gotenberg's among them (compose.prod.yaml and
  # compose.dev.yaml pin the same one: one pull request raises both).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
