name: Sign an image
description: >
  Keyless-sign a pushed image with cosign (GitHub OIDC), attest its SLSA
  build provenance and sign its SBOM (CycloneDX, from Trivy) as an
  attestation. The calling job needs id-token: write, attestations: write
  and packages: write, and a login to the registry.
  docs/deployment.md, "Signing and verifying images".
inputs:
  image:
    description: Image name without tag, e.g. ghcr.io/owner/repo
    required: true
  digest:
    description: The pushed image's digest (sha256:...)
    required: true
runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Sign the image
      shell: bash
      env:
        REF: ${{ inputs.image }}@${{ inputs.digest }}
      run: cosign sign --yes "$REF"
    - name: Attest the build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true
    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.76.0
        cache: true
    - name: Generate the SBOM
      shell: bash
      env:
        REF: ${{ inputs.image }}@${{ inputs.digest }}
        SBOM: ${{ runner.temp }}/sbom.cdx.json
      run: trivy image --format cyclonedx --output "$SBOM" "$REF"
    - name: Sign the SBOM
      shell: bash
      env:
        REF: ${{ inputs.image }}@${{ inputs.digest }}
        SBOM: ${{ runner.temp }}/sbom.cdx.json
      run: cosign attest --yes --type cyclonedx --predicate "$SBOM" "$REF"
