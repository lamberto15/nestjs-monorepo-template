# Production on one host: Caddy (HTTPS) in front of API_REPLICAS api
# instances, WORKER_REPLICAS workers for the background work (Gotenberg
# renders their PDFs), PostgreSQL and Redis from compose.yaml, migrations
# once per deploy. Every service has CPU and memory limits, so none starves
# the others (they don't add capacity: keep their sum within the host's).
# .env (copied from env.example) sets COMPOSE_FILE, so
# `docker compose up -d --build` deploys, and `docker compose ps` shows it.
#
# Every part of the app is safe with several instances: sessions, locks,
# rate limits, queues, workflows, the outbox and WebSocket fan-out are shared
# through PostgreSQL and Redis. More than one host takes an orchestrator
# (Swarm, Kubernetes, a managed platform) and managed PostgreSQL and Redis.

# Bounded container logs: the same settings as compose.yaml's (postgres,
# redis), which explains the driver.
x-logging: &logging
  driver: ${DOCKER_LOG_DRIVER:-local}
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: '${DOCKER_LOG_MAX_FILE:-5}'
    compress: 'true'

x-app: &app
  # The repository root is the context: the API's image takes the workspace
  # (the lockfile, packages/) with it.
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  # Unset: the image `docker compose up -d --build` builds here. A published
  # one (CI): APP_IMAGE=ghcr.io/<owner>/<repo>:<commit SHA> (docs/deployment.md).
  image: ${APP_IMAGE:-${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}-app}
  restart: unless-stopped
  environment: &app-env
    # Staging too: behaviour follows NODE_ENV; APP_ENV names the deployment.
    NODE_ENV: production
    APP_ENV: ${APP_ENV:-production}
    APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
    WEB_URL: ${WEB_URL:-}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    SERVICE_NAME: ${SERVICE_NAME:-${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}}
    APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    # Forces the mode (normal, read-only, maintenance) over the operators'
    # platform.mode setting (docs/settings.md). This file lists the variables
    # the containers get (no env_file), so a variable missing here never arrives.
    APP_MODE: ${APP_MODE:-}
    LOCALES: ${LOCALES:-en,de,ar,zh,ms}
    LOG_FORMAT: ${LOG_FORMAT:-}
    LOG_LEVEL: ${LOG_LEVEL:-log}
    OPENAPI: ${OPENAPI:-on}
    # The app's role (docs/deployment.md, "Database roles"): owns nothing, can't
    # change the schema or bypass row-level security. `migrate` creates it from
    # this URL; only `migrate` also gets the owner's (below). Built from
    # POSTGRES_APP_PASSWORD; with the password in a file, the whole URL comes
    # from DATABASE_URL_FILE instead (below). Neither set: `migrate` exits 1.
    DATABASE_URL: ${DATABASE_URL:-${POSTGRES_APP_PASSWORD:+postgres://${POSTGRES_APP_USER:-app_runtime}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}}}
    # Fail fast instead of hanging when the pool is exhausted; limits on slow
    # statements and forgotten transactions. Pool sizes: per service below.
    DATABASE_POOL_TIMEOUT_MS: ${DATABASE_POOL_TIMEOUT_MS:-5000}
    DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
    DATABASE_IDLE_TX_TIMEOUT_MS: ${DATABASE_IDLE_TX_TIMEOUT_MS:-60000}
    REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379/0}
    REDIS_SENTINELS: ${REDIS_SENTINELS:-}
    REDIS_SENTINEL_NAME: ${REDIS_SENTINEL_NAME:-}
    REDIS_PREFIX: ${REDIS_PREFIX:-app}
    RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
    MIGRATE_ON_START: 'off'
    # Accounts
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ADMIN_TENANT_NAME: ${ADMIN_TENANT_NAME:-}
    ADMIN_ONBOARDING: ${ADMIN_ONBOARDING:-on}
    TENANCY: ${TENANCY:-multi}
    SIGN_UP_ROLES: ${SIGN_UP_ROLES:-}
    AUTH_SIGN_UP: ${AUTH_SIGN_UP:-off}
    TENANT_SIGN_UP: ${TENANT_SIGN_UP:-off}
    AUTH_MAGIC_LINK: ${AUTH_MAGIC_LINK:-on}
    IMPERSONATION: ${IMPERSONATION:-off}
    AUTH_MFA: ${AUTH_MFA:-on}
    API_CLIENTS: ${API_CLIENTS:-on}
    JWT_SECRET: ${JWT_SECRET:-}
    MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:-}
    MFA_ISSUER: ${MFA_ISSUER:-}
    INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
    IMPERSONATION_TTL_MINUTES: ${IMPERSONATION_TTL_MINUTES:-60}
    REAUTHENTICATION_MAX_AGE_MINUTES: ${REAUTHENTICATION_MAX_AGE_MINUTES:-10}
    SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
    SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
    # Passkeys (docs/auth.md, "Passkeys"): the relying party is WEB_URL's
    # host (else APP_DOMAIN) unless PASSKEY_RP_ID says otherwise; it never
    # changes once passkeys exist. The app refuses inconsistent values.
    PASSKEYS: ${PASSKEYS:-on}
    PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
    PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-}
    PASSKEY_ORIGINS: ${PASSKEY_ORIGINS:-}
    PASSKEY_CHALLENGE_TTL_SECONDS: ${PASSKEY_CHALLENGE_TTL_SECONDS:-120}
    PASSKEY_ANDROID_APPS: ${PASSKEY_ANDROID_APPS:-}
    PASSKEY_APPLE_APPS: ${PASSKEY_APPLE_APPS:-}
    AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-400}
    SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS:-30}
    # Deployment switches (docs/configuration.md): platform modules a
    # project may not need; off leaves routes, workers and jobs out.
    WEBHOOKS: ${WEBHOOKS:-on}
    REPORTS: ${REPORTS:-on}
    USAGE: ${USAGE:-on}
    REALTIME: ${REALTIME:-on}
    # New passwords against Pwned Passwords (docs/auth.md, "Passwords")
    PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-on}
    PASSWORD_BREACH_API_URL: ${PASSWORD_BREACH_API_URL:-https://api.pwnedpasswords.com}
    PASSWORD_BREACH_TIMEOUT_MS: ${PASSWORD_BREACH_TIMEOUT_MS:-2000}
    PASSWORD_BREACH_ON_ERROR: ${PASSWORD_BREACH_ON_ERROR:-allow}
    PASSWORD_BREACH_MIN_COUNT: ${PASSWORD_BREACH_MIN_COUNT:-1}
    PASSWORD_BREACH_RECHECK_DAYS: ${PASSWORD_BREACH_RECHECK_DAYS:-30}
    # Password hashes (scrypt, 128 MiB each outside the heap) at once per
    # process, the rest queued then 503 server_busy: the memory limits below
    # hold the heap plus these (docs/deployment.md, "Resource limits").
    PASSWORD_HASH_MAX_QUEUE: ${PASSWORD_HASH_MAX_QUEUE:-20}
    PASSWORD_HASH_QUEUE_TIMEOUT_MS: ${PASSWORD_HASH_QUEUE_TIMEOUT_MS:-5000}
    # Bot protection on the public account routes (docs/auth.md, "Bot
    # protection"): off until the Turnstile keys are set. Never the stub here.
    CAPTCHA_MODE: ${CAPTCHA_MODE:-off}
    CAPTCHA_PROVIDER: turnstile
    TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    CAPTCHA_HOSTNAMES: ${CAPTCHA_HOSTNAMES:-}
    CAPTCHA_TIMEOUT_MS: ${CAPTCHA_TIMEOUT_MS:-2000}
    CAPTCHA_ON_ERROR: ${CAPTCHA_ON_ERROR:-allow}
    CAPTCHA_FAILURES: ${CAPTCHA_FAILURES:-3}
    CAPTCHA_FAILURES_WINDOW_MINUTES: ${CAPTCHA_FAILURES_WINDOW_MINUTES:-15}
    CAPTCHA_DEGRADED_LIMIT: ${CAPTCHA_DEGRADED_LIMIT:-2}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
    MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
    MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    # Mail: `log` until a provider is configured
    MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
    MAIL_FROM: ${MAIL_FROM:-}
    SMTP_URL: ${SMTP_URL:-}
    SES_ENDPOINT: ${SES_ENDPOINT:-}
    MAIL_API_KEY: ${MAIL_API_KEY:-}
    # Files: the shared volume below, or S3
    STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    STORAGE_SIGNING_KEYS: ${STORAGE_SIGNING_KEYS:-}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    AWS_REGION: ${AWS_REGION:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    # Idempotency-Key demanded (required) or only honoured (optional)
    IDEMPOTENCY: ${IDEMPOTENCY:-}
    # Keys at rest
    IDEMPOTENCY_KEYS: ${IDEMPOTENCY_KEYS:-}
    CURSOR_KEYS: ${CURSOR_KEYS:-}
    WEBHOOKS_ENCRYPTION_KEYS: ${WEBHOOKS_ENCRYPTION_KEYS:-}
    # Encrypted columns and their blind indexes (docs/encryption.md)
    DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:-}
    BLIND_INDEX_KEYS: ${BLIND_INDEX_KEYS:-}
    # Malware scanning of uploads (docs/attachments.md, "Malware scanning"):
    # off unless .env says clamav; compose.clamav.yaml adds clamd and sets it
    # for api and worker. Here, in x-app, so every service built from it
    # reads .env alike: the blue-green colours extend `api` as it is in this
    # file, without any overlay's changes to it (docs/deployment.md, "ClamAV
    # (malware scanning)"), and api needs it as much as the worker (it stores
    # an upload `pending` and queues the scan, with the attempts below).
    MALWARE_SCANNER: ${MALWARE_SCANNER:-off}
    CLAMAV_HOST: ${CLAMAV_HOST:-}
    CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-60000}
    MALWARE_SCAN_ATTEMPTS: ${MALWARE_SCAN_ATTEMPTS:-5}
    # Renditions and metadata stripping of uploaded images (docs/attachments.md,
    # "Image renditions"): api stores an upload `pending` and queues the job,
    # the worker runs it, so both read these.
    IMAGE_PROCESSING: ${IMAGE_PROCESSING:-on}
    IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-50000000}
    IMAGE_TIMEOUT_MS: ${IMAGE_TIMEOUT_MS:-30000}
    IMAGE_STRIP_ORIGINALS: ${IMAGE_STRIP_ORIGINALS:-on}
    # PDF documents (docs/documents.md): the gotenberg service below. Empty: documents off.
    GOTENBERG_URL: ${GOTENBERG_URL-http://gotenberg:3000}
    GOTENBERG_TIMEOUT_MS: ${GOTENBERG_TIMEOUT_MS:-30000}
    DOCUMENTS_RENDER_ATTEMPTS: ${DOCUMENTS_RENDER_ATTEMPTS:-3}
    # AI helper (docs/ai.md): off unless the key is set (in .env, or in the file ANTHROPIC_API_KEY_FILE names below).
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
    AI_MODEL_CHEAP: ${AI_MODEL_CHEAP:-claude-haiku-5-5}
    AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
    AI_ATTEMPTS: ${AI_ATTEMPTS:-2}
    AI_TENANT_DAILY_TOKENS: ${AI_TENANT_DAILY_TOKENS:-500000}
    AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-3600}
    # Observability (NestJS Observe, when both are set)
    OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-}
    OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-}
    # OpenTelemetry (OTLP/HTTP) and Sentry, each off when empty
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    # Prometheus' bearer token for GET /metrics (unset: 404); scraped inside the network only.
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    # The example feature
    EXAMPLE_SENDER_WEBHOOK_SECRET: ${EXAMPLE_SENDER_WEBHOOK_SECRET:-}
    NOTE_PUBLISH_DELAY: ${NOTE_PUBLISH_DELAY:-10s}
    # Secrets from files (docs/configuration.md, "Secrets"): X_FILE in .env
    # names a file on the host, mounted as a Docker secret; the app then reads
    # /run/secrets/x. Unset, the app gets no X_FILE and X stays the source.
    DATABASE_URL_FILE: ${DATABASE_URL_FILE:+/run/secrets/database_url}
    REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:+/run/secrets/redis_password}
    ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:+/run/secrets/admin_password}
    JWT_SECRET_FILE: ${JWT_SECRET_FILE:+/run/secrets/jwt_secret}
    MFA_ENCRYPTION_KEYS_FILE: ${MFA_ENCRYPTION_KEYS_FILE:+/run/secrets/mfa_encryption_keys}
    GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE:+/run/secrets/google_client_secret}
    MICROSOFT_CLIENT_SECRET_FILE: ${MICROSOFT_CLIENT_SECRET_FILE:+/run/secrets/microsoft_client_secret}
    GITHUB_CLIENT_SECRET_FILE: ${GITHUB_CLIENT_SECRET_FILE:+/run/secrets/github_client_secret}
    TURNSTILE_SECRET_KEY_FILE: ${TURNSTILE_SECRET_KEY_FILE:+/run/secrets/turnstile_secret_key}
    SMTP_URL_FILE: ${SMTP_URL_FILE:+/run/secrets/smtp_url}
    MAIL_API_KEY_FILE: ${MAIL_API_KEY_FILE:+/run/secrets/mail_api_key}
    STORAGE_SIGNING_KEYS_FILE: ${STORAGE_SIGNING_KEYS_FILE:+/run/secrets/storage_signing_keys}
    AWS_SECRET_ACCESS_KEY_FILE: ${AWS_SECRET_ACCESS_KEY_FILE:+/run/secrets/aws_secret_access_key}
    IDEMPOTENCY_KEYS_FILE: ${IDEMPOTENCY_KEYS_FILE:+/run/secrets/idempotency_keys}
    CURSOR_KEYS_FILE: ${CURSOR_KEYS_FILE:+/run/secrets/cursor_keys}
    WEBHOOKS_ENCRYPTION_KEYS_FILE: ${WEBHOOKS_ENCRYPTION_KEYS_FILE:+/run/secrets/webhooks_encryption_keys}
    DATA_ENCRYPTION_KEYS_FILE: ${DATA_ENCRYPTION_KEYS_FILE:+/run/secrets/data_encryption_keys}
    BLIND_INDEX_KEYS_FILE: ${BLIND_INDEX_KEYS_FILE:+/run/secrets/blind_index_keys}
    OBSERVE_APP_SECRET_FILE: ${OBSERVE_APP_SECRET_FILE:+/run/secrets/observe_app_secret}
    EXAMPLE_SENDER_WEBHOOK_SECRET_FILE: ${EXAMPLE_SENDER_WEBHOOK_SECRET_FILE:+/run/secrets/example_sender_webhook_secret}
    ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:+/run/secrets/anthropic_api_key}
  # Every secret is mounted; those without X_FILE in .env are the empty secret.empty.
  secrets:
    - database_url
    - redis_password
    - admin_password
    - jwt_secret
    - mfa_encryption_keys
    - google_client_secret
    - microsoft_client_secret
    - github_client_secret
    - turnstile_secret_key
    - smtp_url
    - mail_api_key
    - storage_signing_keys
    - aws_secret_access_key
    - idempotency_keys
    - cursor_keys
    - webhooks_encryption_keys
    - data_encryption_keys
    - blind_index_keys
    - observe_app_secret
    - example_sender_webhook_secret
    - anthropic_api_key
  logging: *logging
  # Hardened (docs/deployment.md, "Container hardening"): the image is
  # read-only, /tmp is the only place the process writes besides the files
  # volume (api, worker), and it needs no Linux capability, nor a way to gain one.
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  # Once per deploy, before the app: the app's and the stores' migrations, as
  # the owner of the tables (POSTGRES_USER, the server's superuser here), then
  # the app's role and its grants.
  migrate:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/migrate']
    environment:
      <<: *app-env
      # Built from POSTGRES_PASSWORD; with the password in a file, the whole
      # URL comes from DATABASE_OWNER_URL_FILE instead. Neither set: exits 1.
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:-${POSTGRES_PASSWORD:+postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}}}
      DATABASE_OWNER_URL_FILE: ${DATABASE_OWNER_URL_FILE:+/run/secrets/database_owner_url}
      # The maintenance role (BYPASSRLS: docs/tenancy.md, "The bypass"):
      # migrate makes it, the worker's sweeps across tenants connect as it;
      # api never gets it. Built from POSTGRES_MAINTENANCE_PASSWORD, or the
      # whole URL from DATABASE_MAINTENANCE_URL_FILE.
      DATABASE_MAINTENANCE_URL: ${DATABASE_MAINTENANCE_URL:-${POSTGRES_MAINTENANCE_PASSWORD:+postgres://${POSTGRES_MAINTENANCE_USER:-app_maintenance}:${POSTGRES_MAINTENANCE_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}}}
      DATABASE_MAINTENANCE_URL_FILE: ${DATABASE_MAINTENANCE_URL_FILE:+/run/secrets/database_maintenance_url}
      # The reporting role (docs/tenancy.md, "Platform analytics"): made when
      # POSTGRES_REPORTING_PASSWORD (or its file) is set; it reads the
      # `analytics` aggregates only. Its users connect from outside the stack.
      POSTGRES_REPORTING_USER: ${POSTGRES_REPORTING_USER:-app_reporting}
      POSTGRES_REPORTING_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:-}
      POSTGRES_REPORTING_PASSWORD_FILE: ${POSTGRES_REPORTING_PASSWORD_FILE:+/run/secrets/postgres_reporting_password}
    # Only the URLs it reads (not x-app's list): the owner's credential is
    # mounted here and nowhere else; api and worker never see it.
    secrets:
      - database_url
      - database_owner_url
      - database_maintenance_url
      - postgres_reporting_password
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy

  # HTTP only (APP_ROLE=api): Caddy balances across the replicas.
  api:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: api
      # Connections per replica: API_REPLICAS × this + the workers' < POSTGRES_MAX_CONNECTIONS.
      DATABASE_POOL_MAX: ${API_DATABASE_POOL_MAX:-10}
      # The V8 heap under the container's memory limit, leaving room for
      # buffers and the password hashes: API_MEMORY ≥ API_HEAP_MB + 128 MiB
      # (native, MFA codes) + API_PASSWORD_HASH_CONCURRENCY × 128 MiB
      # (docs/deployment.md, "Resource limits"): 384 + 128 + 2 × 128 = 768.
      NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-384}
      PASSWORD_HASH_CONCURRENCY: ${API_PASSWORD_HASH_CONCURRENCY:-2}
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          cpus: '${API_CPUS:-1}'
          memory: ${API_MEMORY:-768M}
    # /health turns 503 on SIGTERM, then requests in flight finish.
    stop_grace_period: 30s
    # The image's liveness check, probed faster: a rolling deploy
    # (docs/deploy-rolling.md) waits for it before it stops the old containers.
    healthcheck:
      interval: 10s
      start_period: 30s
      start_interval: 2s
    volumes:
      # Shared by every replica: the local disk's files.
      - app_storage:/app/.data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Background work (APP_ROLE=worker): queue jobs (mail, exports, imports),
  # the outbox relay, webhook deliveries, workflow steps, cron jobs. Not
  # routed: it serves only its health checks.
  worker:
    <<: *app
    command: ['node', 'dist/worker']
    environment:
      <<: *app-env
      APP_ROLE: worker
      # The maintenance role (BYPASSRLS: docs/tenancy.md, "The bypass"):
      # migrate makes it, the worker's sweeps across tenants connect as it;
      # api never gets it. Built from POSTGRES_MAINTENANCE_PASSWORD, or the
      # whole URL from DATABASE_MAINTENANCE_URL_FILE.
      DATABASE_MAINTENANCE_URL: ${DATABASE_MAINTENANCE_URL:-${POSTGRES_MAINTENANCE_PASSWORD:+postgres://${POSTGRES_MAINTENANCE_USER:-app_maintenance}:${POSTGRES_MAINTENANCE_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}}}
      DATABASE_MAINTENANCE_URL_FILE: ${DATABASE_MAINTENANCE_URL_FILE:+/run/secrets/database_maintenance_url}
      # Workflow steps (10), exports (2), mail (5), the relay and deliveries run at once.
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-20}
      NODE_OPTIONS: --max-old-space-size=${WORKER_HEAP_MB:-768}
      # It serves no sign-ins: it hashes only at the first start of a
      # deployment, when every process (api and worker alike) runs the seeder
      # and hashes the first administrator's password. One at a time:
      # 768 + 128 + 1 × 128 = 1024, within WORKER_MEMORY (1G).
      PASSWORD_HASH_CONCURRENCY: ${WORKER_PASSWORD_HASH_CONCURRENCY:-1}
    # x-app's, and the maintenance role's URL: the worker's alone.
    secrets:
      - database_url
      - redis_password
      - admin_password
      - jwt_secret
      - mfa_encryption_keys
      - google_client_secret
      - microsoft_client_secret
      - github_client_secret
      - turnstile_secret_key
      - smtp_url
      - mail_api_key
      - storage_signing_keys
      - aws_secret_access_key
      - idempotency_keys
      - cursor_keys
      - webhooks_encryption_keys
      - data_encryption_keys
      - blind_index_keys
      - observe_app_secret
      - example_sender_webhook_secret
      - anthropic_api_key
      - database_maintenance_url
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: '${WORKER_CPUS:-1}'
          memory: ${WORKER_MEMORY:-1G}
    # Running jobs and workflow steps finish (or are handed back) before it stops.
    stop_grace_period: 60s
    # The image's liveness check, probed faster: a rolling deploy
    # (docs/deploy-rolling.md) waits for it before it stops the old containers.
    healthcheck:
      interval: 10s
      start_period: 30s
      start_interval: 2s
    volumes:
      - app_storage:/app/.data/storage
    # `documents`: Gotenberg's network, which only the workers join.
    networks:
      - default
      - documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    # The password, or POSTGRES_PASSWORD_FILE: the image reads the file itself
    # (on the first start only: it sets the password of a new database).
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:+/run/secrets/postgres_password}
    secrets:
      - postgres_password
    # Explicit, so the pools' sum can be checked against it (docs/deployment.md).
    command: ['postgres', '-c', 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}']
    # Hardened (docs/deployment.md, "Container hardening"): the data volume,
    # /tmp and the socket directory are the only writable paths. The image's
    # entrypoint starts as root, fixes the data directory's owner and drops to
    # `postgres` (gosu), hence these five capabilities and no more.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /run/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-2}'
          memory: ${POSTGRES_MEMORY:-2G}

  redis:
    # Or REDIS_PASSWORD_FILE, read by the server (compose.yaml) and the app alike.
    environment:
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:+/run/secrets/redis_password}
    secrets:
      - redis_password
    # Hardened (docs/deployment.md, "Container hardening"): /data (the
    # volume) and /tmp (redis.sh's here-document) are the only writable
    # paths. The command is `sh redis.sh`, not `redis-server`, so the image's
    # entrypoint never chowns /data or drops to `redis`: the server runs as
    # root, on a volume the image made `redis`'s. Root without DAC_OVERRIDE
    # can't write there (no appendonlydir on a new volume, no RDB save
    # later): that one capability, and no more.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-1}'
          memory: ${REDIS_MEMORY:-512M}

  caddy:
    # The repository root is the context: the image also holds the web app
    # (apps/web), built from the workspace.
    build:
      context: .
      dockerfile: caddy/Dockerfile
    # Unset: the image `docker compose up -d --build` builds here. CI's:
    # CADDY_IMAGE=ghcr.io/<owner>/<repo>/caddy:<commit SHA> (docs/deployment.md).
    image: ${CADDY_IMAGE:-${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}-caddy}
    restart: unless-stopped
    logging: *logging
    # Docker sees it healthy once it serves its admin API (localhost only, in
    # the container): the process is up and its configuration loaded.
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    # Hardened (docs/deployment.md, "Container hardening"): Caddy writes
    # /data (certificates) and /config (autosaved configuration), both
    # volumes, and /tmp. It runs as root and owns what it writes; it only
    # needs to bind ports 80 and 443.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    secrets:
      - cloudflare_api_token
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      # Or CLOUDFLARE_API_TOKEN_FILE (caddy/entrypoint.sh reads it; it stops
      # when neither is set).
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_API_TOKEN_FILE: ${CLOUDFLARE_API_TOKEN_FILE:+/run/secrets/cloudflare_api_token}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # /.well-known/security.txt (RFC 9116; caddy/entrypoint.sh writes it at
      # each start). No file while SECURITY_CONTACT is empty.
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      SECURITY_EXPIRES: ${SECURITY_EXPIRES:-}
      SECURITY_POLICY: ${SECURITY_POLICY:-https://github.com/lamberto15/nestjs-monorepo-template/blob/main/SECURITY.md}
      SECURITY_PREFERRED_LANGUAGES: ${SECURITY_PREFERRED_LANGUAGES:-en}
      # on: the web app's paths answer the static maintenance page (503)
      # instead of the app (caddy/Caddyfile, docs/deployment.md, "Maintenance
      # page"); the API's paths are untouched. Anything else: off.
      MAINTENANCE_PAGE: ${MAINTENANCE_PAGE:-off}
      # With STORAGE_DRIVER=s3 the web app's Content-Security-Policy names the
      # bucket's origin (connect-src: the browser PUTs direct uploads to it);
      # caddy/entrypoint.sh derives it from the app's own S3_* settings.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # HTML to PDF for the workers (docs/documents.md): Chromium in its own
  # container, never in the worker's (a browser out of memory or attacked
  # doesn't take the queues and the database credentials with it). The
  # official image, pinned, made thin on top of (gotenberg/Dockerfile: no
  # fixable high or critical vulnerability, CI scans it, then publishes it:
  # GOTENBERG_IMAGE, as APP_IMAGE for the app; unset, built here). Only the workers
  # reach it, on `documents`, a network with no way out (internal: no
  # gateway, no published port); Chromium may load the page it is given
  # (its own /tmp) and nothing else, whatever the page asks for, and runs
  # no JavaScript. Gotenberg's other outgoing calls (downloadFrom, webhooks)
  # are off. Read-only, no capabilities: only /tmp and its home are written.
  gotenberg:
    build: ./gotenberg
    # Unset: the image `docker compose up -d --build` builds here. CI's:
    # GOTENBERG_IMAGE=ghcr.io/<owner>/<repo>/gotenberg:<commit SHA> (docs/deployment.md).
    image: ${GOTENBERG_IMAGE:-${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}-gotenberg}
    restart: unless-stopped
    logging: *logging
    # The same flags as compose.dev.yaml's (CI's gotenberg-image job compares them).
    command:
      - gotenberg
      - --chromium-allow-list=^file:///tmp/
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-disable-javascript
      # Renders waiting beyond this answer 429 (the job retries later): a
      # burst never piles up in Gotenberg's memory.
      - --chromium-max-queue-size=20
      - --api-disable-download-from
      - --webhook-disable
      # Longer than the app's GOTENBERG_TIMEOUT_MS: the app gives up first, and retries.
      - --api-timeout=60s
      - --log-format=json
    networks:
      - documents
    read_only: true
    tmpfs:
      - /tmp:size=${GOTENBERG_TMP_SIZE:-512m}
      - /home/gotenberg:size=64m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '${GOTENBERG_CPUS:-1}'
          memory: ${GOTENBERG_MEMORY:-1G}
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Backups (docs/deployment.md, "Backups and restore"): pg_dump on
  # BACKUP_SCHEDULE (cron, UTC) plus the uploaded files (STORAGE_DRIVER=local),
  # kept BACKUP_RETENTION_DAYS in the backups volume, copied to
  # BACKUP_S3_BUCKET when it is set. An hourly check catches up a missed or
  # failed run; unhealthy when the last run failed. One now:
  # `docker compose exec backup backup`.
  backup:
    build: ./backup
    image: ${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}-backup
    restart: unless-stopped
    logging: *logging
    environment:
      # libpq's variables (the stack's database), as the owner of the tables:
      # pg_dump reads everything it owns, and a restore creates and renames
      # databases. The password stays in the environment, never on a command line.
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      # Or from the file (lib.sh reads it), the one PostgreSQL itself reads.
      PGPASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:+/run/secrets/postgres_password}
      PGDATABASE: ${POSTGRES_DB:-app}
      PGAPPNAME: ${SERVICE_NAME:-${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}}:backup
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-25}
      # local: the files volume is archived with each dump; s3: the bucket keeps them.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Off the host (empty bucket: local copies only). Its own bucket and
      # keys, not the app's S3_*: the app's keys can't delete the backups.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-${COMPOSE_PROJECT_NAME:-nestjs-monorepo-template}}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_SECRET_ACCESS_KEY_FILE: ${BACKUP_S3_SECRET_ACCESS_KEY_FILE:+/run/secrets/backup_s3_secret_access_key}
      # age recipients (public keys): dumps, files and WAL are encrypted before
      # they are kept or uploaded. Empty: plaintext. Restoring needs the identity.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # Or from the file (lib.sh reads it), like the S3 key above.
      BACKUP_ENCRYPTION_KEY_FILE: ${BACKUP_ENCRYPTION_KEY_FILE:+/run/secrets/backup_encryption_key}
    secrets:
      - postgres_password
      - backup_s3_secret_access_key
      - backup_encryption_key
    deploy:
      resources:
        limits:
          cpus: '${BACKUP_CPUS:-0.5}'
          memory: ${BACKUP_MEMORY:-512M}
    # A running backup finishes first (supercronic waits for it on SIGTERM).
    stop_grace_period: 2m
    # Hardened (docs/deployment.md, "Container hardening"): it runs as
    # `postgres` and writes /backups (volume) and /tmp (the crontab, the
    # health marker).
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - backups:/backups
      # Read only: the backup never changes the files.
      - app_storage:/storage:ro
    depends_on:
      postgres:
        condition: service_healthy

# The files behind the secrets: X_FILE in .env (an absolute path outside the
# repository, readable by the containers: chmod 644 in a chmod 700
# directory), else the empty secret.empty. A changed file alone doesn't
# recreate a container: `docker compose up -d --force-recreate`.
secrets:
  database_url:
    file: ${DATABASE_URL_FILE:-./secret.empty}
  # The owner's URL: mounted on `migrate` only.
  database_owner_url:
    file: ${DATABASE_OWNER_URL_FILE:-./secret.empty}
  database_maintenance_url:
    file: ${DATABASE_MAINTENANCE_URL_FILE:-./secret.empty}
  # The reporting role's password: mounted on `migrate` only (it sets it).
  postgres_reporting_password:
    file: ${POSTGRES_REPORTING_PASSWORD_FILE:-./secret.empty}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-./secret.empty}
  admin_password:
    file: ${ADMIN_PASSWORD_FILE:-./secret.empty}
  jwt_secret:
    file: ${JWT_SECRET_FILE:-./secret.empty}
  mfa_encryption_keys:
    file: ${MFA_ENCRYPTION_KEYS_FILE:-./secret.empty}
  google_client_secret:
    file: ${GOOGLE_CLIENT_SECRET_FILE:-./secret.empty}
  microsoft_client_secret:
    file: ${MICROSOFT_CLIENT_SECRET_FILE:-./secret.empty}
  github_client_secret:
    file: ${GITHUB_CLIENT_SECRET_FILE:-./secret.empty}
  turnstile_secret_key:
    file: ${TURNSTILE_SECRET_KEY_FILE:-./secret.empty}
  smtp_url:
    file: ${SMTP_URL_FILE:-./secret.empty}
  mail_api_key:
    file: ${MAIL_API_KEY_FILE:-./secret.empty}
  storage_signing_keys:
    file: ${STORAGE_SIGNING_KEYS_FILE:-./secret.empty}
  aws_secret_access_key:
    file: ${AWS_SECRET_ACCESS_KEY_FILE:-./secret.empty}
  idempotency_keys:
    file: ${IDEMPOTENCY_KEYS_FILE:-./secret.empty}
  cursor_keys:
    file: ${CURSOR_KEYS_FILE:-./secret.empty}
  webhooks_encryption_keys:
    file: ${WEBHOOKS_ENCRYPTION_KEYS_FILE:-./secret.empty}
  data_encryption_keys:
    file: ${DATA_ENCRYPTION_KEYS_FILE:-./secret.empty}
  blind_index_keys:
    file: ${BLIND_INDEX_KEYS_FILE:-./secret.empty}
  observe_app_secret:
    file: ${OBSERVE_APP_SECRET_FILE:-./secret.empty}
  example_sender_webhook_secret:
    file: ${EXAMPLE_SENDER_WEBHOOK_SECRET_FILE:-./secret.empty}
  anthropic_api_key:
    file: ${ANTHROPIC_API_KEY_FILE:-./secret.empty}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secret.empty}
  backup_s3_secret_access_key:
    file: ${BACKUP_S3_SECRET_ACCESS_KEY_FILE:-./secret.empty}
  backup_encryption_key:
    file: ${BACKUP_ENCRYPTION_KEY_FILE:-./secret.empty}
  cloudflare_api_token:
    file: ${CLOUDFLARE_API_TOKEN_FILE:-./secret.empty}

# Gotenberg's: no gateway, so nothing on it reaches the internet or the
# host's other networks; the workers join it besides the default one.
networks:
  documents:
    internal: true

volumes:
  app_storage:
  caddy_data:
  caddy_config:
  backups:
